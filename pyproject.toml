[project]
name = "Moss-finagent-research"
version = "0.1.0"
description = "基于多Agent协作的AI辅助投研分析系统（Demo版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "celery>=5.4",
    "langgraph>=0.2",
    "langchain>=0.3",
    "pymysql>=1.2.0",
    "pypinyin>=0.55.0",
    "eltdx>=3.2.2",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "tushare>=1.4",
    "baostock>=0.8",
    "xtquant>=250807",  # 迅投QMT本地行情（需XtMiniQmt运行；未运行时自动回退）
]

[dependency-groups]
dev = [
    # pytest锁定8.3线：9.x的tmp_path PathLocker在Windows上每次加锁30-60s（实测4测试157s）
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv]
# 应用项目，不做包构建安装，uv run / pytest 直接从项目根解析 src.* 导入
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# RLS 故意延迟 import sqlalchemy（避免无 SQLAlchemy 环境崩）
"src/infrastructure/security/rls.py" = ["E402"]
# scripts/ 下临时脚本质量要求低
"scripts/*" = ["F", "E402", "I001", "F541"]
# 导入脚本的 docstring 是"数据来源 → 内容"对照表（中文按列对齐），行宽无意义
"scripts/import_mainline_backtests.py" = ["E501"]
# 这两处的文档字符串里有大量中文对照表与推导说明，行宽按"列"算没有意义
"src/intraday/engine.py" = ["E501"]
"src/intraday/level_fit.py" = ["E501"]
"src/intraday/impact.py" = ["E501"]
"src/fundflow/*" = ["E501"]
# moss_selector 的 docstring 里是口径对照表与复用来源表，列宽同样无意义
"moss_selector/*" = ["E501"]
