[project]
name = "finagent-research"
version = "0.1.0"
description = "基于多Agent协作的AI辅助投研分析系统（Demo版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "celery>=5.4",
    "langgraph>=0.2",
    "langchain>=0.3",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "tushare>=1.4",
    "baostock>=0.8",
]

[dependency-groups]
dev = [
    # pytest锁定8.3线：9.x的tmp_path PathLocker在Windows上每次加锁30-60s（实测4测试157s）
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.uv]
# 应用项目，不做包构建安装，uv run / pytest 直接从项目根解析 src.* 导入
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
