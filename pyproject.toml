[project]
name = "Moss-finagent-research"
version = "0.1.0"
description = "基于多Agent协作的AI辅助投研分析系统（Demo版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "celery>=5.4",
    "langgraph>=0.2",
    "langchain>=0.3",
    "pymysql>=1.2.0",
    "pypinyin>=0.55.0",
    "eltdx>=3.2.2",
    "pypdf>=6.19.0",
    # 数据处理基础（数据层/指标/因子广泛使用，运行期必需）
    "numpy>=2.1",
    "pandas>=2.2",
    # HTTP 直连连接器（akshare/index_valuation 等连接器模块顶层使用）
    "requests>=2.31",
    # 登录人机校验验证码图片；资金流/板块缓存落盘读回（parquet）
    "Pillow>=10.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "tushare>=1.4",
    "baostock>=0.8",
    "xtquant>=250807",  # 迅投QMT本地行情（需XtMiniQmt运行；未运行时自动回退）
]

[dependency-groups]
dev = [
    # pytest锁定8.3线：9.x的tmp_path PathLocker在Windows上每次加锁30-60s（实测4测试157s）
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # 测试套件离线运行所需（连接器测试对这些包打桩/读本地夹具，不访问外网）：
    # openpyxl：pandas.read_excel 读取 .xls/.xlsx 夹具
    # scikit-learn：manage 预检等用例预期其已安装
    # akshare/tushare：连接器回归用例需要 import 包本体来打桩（网络仍为假）
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "akshare>=1.14",
    "tushare>=1.4",
]

[tool.uv]
# 应用项目，不做包构建安装，uv run / pytest 直接从项目根解析 src.* 导入
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# RLS 故意延迟 import sqlalchemy（避免无 SQLAlchemy 环境崩）
"src/infrastructure/security/rls.py" = ["E402"]
# scripts/ 下临时脚本质量要求低
"scripts/*" = ["F", "E402", "I001", "F541"]
# 导入脚本的 docstring 是"数据来源 → 内容"对照表（中文按列对齐），行宽无意义
"scripts/import_mainline_backtests.py" = ["E501"]
# 这两处的文档字符串里有大量中文对照表与推导说明，行宽按"列"算没有意义
"src/intraday/engine.py" = ["E501"]
"src/intraday/level_fit.py" = ["E501"]
"src/intraday/impact.py" = ["E501"]
"src/fundflow/*" = ["E501"]
# moss_selector 的 docstring 里是口径对照表与复用来源表，列宽同样无意义
"moss_selector/*" = ["E501"]
# jicai 集采数据字典：note 是带来源复核说明的中文文本，机械断行会肢解引用信息
"src/infrastructure/connectors/jicai_price_source.py" = ["E501"]
# 以下 docstring 是 markdown 对照/规则表格（日历主备链 / 命中规则 / 模型分层 / 到期提示），列宽无意义
"scripts/scan_date_bombs.py" = ["E501"]
"src/domain/intel/calendar.py" = ["E501"]
"src/domain/intel/hot_scan.py" = ["E501"]
"src/domain/intel/llm_policy.py" = ["E501"]
"src/domain/intel/token_alerts.py" = ["E501"]
