[project]
name = "Moss-finagent-research"
version = "0.1.0"
description = "基于多Agent协作的AI辅助投研分析系统（Demo版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "celery>=5.4",
    "langgraph>=0.2",
    "langchain>=0.3",
    "pymysql>=1.2.0",
    "pypinyin>=0.55.0",
    "eltdx>=3.2.2",
    "pypdf>=6.19.0",
    # 数据处理基础（数据层/指标/因子广泛使用，运行期必需）
    "numpy>=2.1",
    "pandas>=2.2",
    # HTTP 直连连接器（akshare/index_valuation 等连接器模块顶层使用）
    "requests>=2.31",
    # 登录人机校验验证码图片；资金流/板块缓存落盘读回（parquet）
    "Pillow>=10.0",
    "pyarrow>=15.0",
    # 口令哈希（`CHG-0237`）：**不是"可选的加强项"，是承重件** ——
    #   pilot 库 34 个账号里 **21 个是 `$2b$`（bcrypt）**哈希，而
    #   `verify_password()` 是**按哈希前缀派发算法**的，且"任何异常都返回 False"
    #   ⇒ 环境里没有 bcrypt 时，那 21 个账号的校验直接落到 False，
    #   用户在界面上看到的是**「密码错误」** —— 与真的输错密码**长得一模一样**。
    #   （`_pick_algo()` 仍有 argon2id > bcrypt > pbkdf2 的降级顺序，
    #     所以"新哈希用哪个算法"仍随环境变；但"已有哈希能不能验"不能随环境变。）
    "bcrypt>=4.0",
    # 量化选股模型的反序列化依赖（`CHG-0238`）：**AST 静态扫不到它** ——
    #   全仓没有一处 `import lightgbm`，但 `moss_selector/models/*` 是 joblib 产物，
    #   **反序列化时会去 import lightgbm**；缺了它的表现不是报错，而是
    #   「moss_selector/models 下没有可用的模型文件」+ 反复自动重训（模型其实一直都在）。
    #   ★ 是 `manage.py` 自己的依赖自检拦住了启动并说清了原因 —— 那条自检是对的，
    #     本条只是把它拦的那个包**声明出来**。
    "lightgbm>=4.0",
]

[project.optional-dependencies]
data = [
    "akshare>=1.14",
    "tushare>=1.4",
    "baostock>=0.8",
    "xtquant>=250807",  # 迅投QMT本地行情（需XtMiniQmt运行；未运行时自动回退）
]
# 分布式追踪（`CHG-0174`）。**刻意做成可选**：
#   ① 本项目默认零依赖可跑（SQLite + 本地模型），追踪只是"调用树"这一块的补强；
#   ② 没装时 `tracing.init_tracing()` 如实返回 `no_sdk` 并**完全不影响应用**
#      （fail-open），不是静默降级成假绿；
#   ③ 装了才生效 —— `uv sync --extra otel`。
otel = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    # HTTP 而非 gRPC：本地 sink / collector 只需一个 POST 端点，
    # 少一层端口与 TLS 面（gRPC 还要 4317 与额外的 HTTP/2 依赖）。
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]
# 公网入口 `hk.wujiaitool.cn` 的 SSH 隧道依赖（`scripts/frp_ssh_tunnel.py`）。
#
# ★ `CHG-0237` 把它**从"临时装的"变成"声明的"** —— 事故根因正是这一条：
#   隧道要 paramiko，而 paramiko **不在任何依赖组里**，只被手工装进 venv；
#   于是任何一次裸 `uv sync` 都会把 paramiko（连同它带进来的
#   bcrypt / cryptography / pynacl）当作"多余的包"清掉 ⇒
#   `import paramiko` 失败 ⇒ 隧道退出 ⇒ VPS nginx 上游为空 ⇒ **全站 502**，
#   而这一切在应用日志里**一行都没有**（故障发生在应用之外）。
#
# ★ 做成 extra 而不是 core：保持"默认零依赖可跑"（本地/测试/CI 不需要隧道）。
#   ⇒ 部署侧的正确命令是 `uv sync --all-extras`（见 docs/OPS_GUIDE.md）。
tunnel = [
    "paramiko>=3.4",
]

[dependency-groups]
dev = [
    # pytest锁定8.3线：9.x的tmp_path PathLocker在Windows上每次加锁30-60s（实测4测试157s）
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # 测试套件离线运行所需（连接器测试对这些包打桩/读本地夹具，不访问外网）：
    # openpyxl：pandas.read_excel 读取 .xls/.xlsx 夹具
    # scikit-learn：manage 预检等用例预期其已安装
    # akshare/tushare：连接器回归用例需要 import 包本体来打桩（网络仍为假）
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "akshare>=1.14",
    "tushare>=1.4",
]

[tool.uv]
# 应用项目，不做包构建安装，uv run / pytest 直接从项目根解析 src.* 导入
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# RLS 故意延迟 import sqlalchemy（避免无 SQLAlchemy 环境崩）
"src/infrastructure/security/rls.py" = ["E402"]
# scripts/ 下临时脚本质量要求低
"scripts/*" = ["F", "E402", "I001", "F541"]
# 导入脚本的 docstring 是"数据来源 → 内容"对照表（中文按列对齐），行宽无意义
"scripts/import_mainline_backtests.py" = ["E501"]
# 这两处的文档字符串里有大量中文对照表与推导说明，行宽按"列"算没有意义
"src/intraday/engine.py" = ["E501"]
"src/intraday/level_fit.py" = ["E501"]
"src/intraday/impact.py" = ["E501"]
"src/fundflow/*" = ["E501"]
# moss_selector 的 docstring 里是口径对照表与复用来源表，列宽同样无意义
"moss_selector/*" = ["E501"]
# jicai 集采数据字典：note 是带来源复核说明的中文文本，机械断行会肢解引用信息
"src/infrastructure/connectors/jicai_price_source.py" = ["E501"]
# 以下 docstring 是 markdown 对照/规则表格（日历主备链 / 命中规则 / 模型分层 / 到期提示），列宽无意义
"scripts/scan_date_bombs.py" = ["E501"]
"src/domain/intel/calendar.py" = ["E501"]
"src/domain/intel/hot_scan.py" = ["E501"]
"src/domain/intel/llm_policy.py" = ["E501"]
"src/domain/intel/token_alerts.py" = ["E501"]
