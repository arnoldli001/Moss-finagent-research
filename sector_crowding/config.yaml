# ============================================================================
# 板块概念拥挤度（sector crowding）配置
#
# 设计原则同项目其它模块：**所有可调参数都在这里，代码里不写死**。
# 分层标注：[库] 数据库  [窗口] 时间窗与阈值  [数据] 数据源  [性能] 并发与限流
#           [前端] API 前缀  [日志] 日志目录
# ============================================================================

# ---------------------------- [库] ------------------------------------------
database:
  # **共享参考数据**库：`sector_crowding_daily` / `sector_meta` /
  # `sector_member` / `sector_crowding_max_ma5`。
  # 这些**没有用户维度**，三个环境读同一份是对的。
  # 写者归属见 `configs/data_stores.yaml` 的 `crowding_shared`（当前 = dev）。
  path: "data/moss_finagent.db"
  # ★ `CHG-0143`：**用户配置**库（`sector_crowding_list` / `_watch` / `_alert`）。
  #   留空 = 跟随 registry 的 `app_db`（本环境应用库）——
  #   dev → `data/dev/moss_dev.db`、pilot → `data/pilot/moss_pilot.db`。
  #
  #   为什么必须与上面那条分开：原先两类数据都塞在 `path` 里，而 `path` 指向
  #   **共享**遗留主库 ⇒ dev 与 pilot 共用同一份板块清单与告警阈值，
  #   开发时点掉的板块**客户那边也消失**（实测 list 只有 1,226 行、三个库共一份）。
  #
  #   ⚠️ **不要**把它写成 `data/moss_finagent.db`（那等于退回整改前）。
  #   启动时会过 `_warn_if_drifted("…config_path", …, "app_db")`，写错会告警。
  config_path: ""
  # 行情仓库（只读）：全A成交额、个股名录取自这里
  warehouse_path: "data/quant/warehouse.db"

# ---------------------------- [窗口] ----------------------------------------
window:
  # 水位分母的回看年数（本轮口径：**近 6 年**最高平滑拥挤度）
  #   上一轮用 5 年，本轮统一改为 6 年；改这里会同时影响水位与告警
  max_lookback_years: 6
  # 平滑窗口：原始拥挤度的 N 日移动平均
  ma_window: 5
  # 告警阈值：拥挤度水位 ≥ 该比例即告警（0.8 = 80%）
  alert_threshold: 0.8
  # ≥9 折用红色高亮（其余告警用橙色）
  high_alert_threshold: 0.9
  # 单板块最少需要多少根日线才认为"可算水位"；不足则 water_level=NULL（前端显示"数据不足"）
  #
  # 为什么是 750（≈3 个交易年）而不是 60：
  #   水位 = 当前平滑拥挤度 / **近 6 年**最高值。对只有半年历史的新板块，
  #   它自己的"历史最高"就是最近这几天 —— 于是水位**恒为 100%**，一上线就误告警。
  #   实测（2026-09-18 首次全量回填后）：min_bars=60 时有 218 个板块 ≥80%、
  #   其中 101 个 ≥90%，绝大多数是这类"历史太短所以永远是自己最高"的板块。
  #   要求至少 3 年，分母才覆盖得上一轮完整涨跌周期，水位才有可比性。
  #   代价：2023 年后发布的新概念在被回填满 3 年前不会出水位（如实显示"数据不足"）。
  min_bars_for_water_level: 750
  # ── 分母的样本量偏差校正（2026-09-27）────────────────────────────
  #
  # 水位分母是**样本最大值**，`E[M_n]` 随 n 单调上升 → 历史短的板块分母偏小、
  # 水位系统性虚高。750 这个二值门槛只把悬崖挪了个位置（750~1460 根有 1033 个
  # 板块，与 >=1460 根那组仍不等价），所以改成**尺度校正**：
  #
  #     denom = M_n · r(n)
  #     r(T)  = median( M_full / M_T )   在满窗板块（n >= 1460）上标定
  #
  # ⚠️ 先试过"向同类中位数收缩"（James-Stein 式），**截断回测证伪**：
  #    越收越偏（k=0 偏差 +0.047 → k=250 时 +0.099）。原因：M_peer 是横截面
  #    中位数，向它收缩会把高于中位的板块分母**调小**，水位反而更高。
  #
  # 标定结果（scripts/calibrate_shrink_k.py → docs/_water_bias_curve.txt）：
  #     T     r(T)    朴素偏差   校正后偏差   MAE改善
  #     60   2.6207   +0.3502    -0.0612     54.3%
  #    250   1.7021   +0.1801    -0.0241     27.0%
  #    500   1.1469   +0.0793    +0.0288      1.3%
  #    750   1.0000   +0.0470    +0.0470      0.0%
  #   1460   1.0000   +0.0002    +0.0002      0.0%
  #
  # `T >= 750` 时 r = 1 是**实测结论**（多数满窗板块的极值就在最近 750 天内），
  # 不是人为设的 —— 所以 750 以上的行为完全不变，改动只影响 750 以下。
  bias_correction_enabled: true
  bias_curve:
    60: 2.620654
    120: 2.377244
    250: 1.702132
    375: 1.301285
    500: 1.146894
    625: 1.04693
    750: 1.0
  # 校正规程下的**发布下限**（根数低于它仍不出水位）。
  #   750 = 满信心门槛（前端据此标「参考」）
  #    60 = 能不能出数的下限，只挡 n 太小的噪声
  min_bars_publish: 60

# ---------------------------- [数据] ----------------------------------------
data:
  # 板块列表来源：ths_index（权威 type 分类）+ 本地 dim_concept（补 851 条新概念）
  board_source: "ths_index+dim_concept"
  # 是否只把"概念板块"计入告警（行业/地区/指数样本/风格 不算概念）
  #   注意：**只影响告警与前端默认筛选，不影响数据落库**（全量照样存，便于以后扩展）
  alert_only_concepts: true
  # "概念"判定的排除规则（板块名/代码命中即视为非概念）。
  # 依据实测：882xxx=地区、883~886xxx=指数样本/风格、7001~7003xxx=全A加权/口径指数；
  # 另按**名称后缀**排除行业与地区指数 —— 实测首次全量回填后，行业板块
  # （"木材加工和木、竹、藤、棕、草制品业指数"）与地区板块（"临沂市指数"）
  # 因为同花顺给它们的 type 是 I/R 而 dim_concept 里没有 type 字段，
  # 被当成了概念板块排进告警列表 —— 那不是用户要的"概念题材"。
  non_concept_name_patterns:
    - "^同花顺全A"
    - "^同花顺金仓"
    - "全收益$"
    - "^昨日涨幅"
    - "^昨日跌幅"
    - "^昨日换手"
    - "样本股$"
    - "成份股$"
    - "成分股$"
    - "业指数$"      # 行业指数（同花顺 I 类）
    - "市指数$"      # 地区指数（同花顺 R 类）
  non_concept_code_prefixes:
    - "882"     # 地区
    - "864"     # 昨日统计
    - "861"     # 行业Ⅲ（dim_concept 独有、无 type 的那批）
    - "7001"    # 同花顺全A/金仓系列
    - "7002"
    - "7003"
  # 单个板块请求的日期切片年数（ths_daily 单次返回有上限，切片更稳）
  fetch_chunk_years: 3

# ---------------------------- [性能] ----------------------------------------
performance:
  # 并发抓取板块日线的线程数（Tushare 限流 500 次/分，实测单次 0.2s，
  # 8 线程 ≈ 40 次/秒 < 上限，留足余量）
  worker_threads: 8
  # 单个板块失败重试次数
  retry_times: 2
  # 进度写入间隔（处理多少个板块更新一次进度，供前端轮询）
  progress_every: 5

# ---------------------------- [前端] ----------------------------------------
api:
  prefix: "/api/sector_crowding"

# ---------------------------- [周频] ----------------------------------------
# 告警面板最右侧 4 列「周频异动指标」：近5日/近1月/近2月拥挤度水位变化 +
# 近1月资金净流入占板块流通市值比。由调度作业 crowding_metrics_weekly
# （每周三 08:30）计算并落库 sector_crowding_metric，避免每天重算。
metrics:
  # 短窗口：近 N 个**交易日**的水位变化
  short_days: 5
  # "近 1 个月"折算多少个交易日（2 个月 = 这个值 × long_month_multiplier）
  month_trading_days: 20
  long_month_multiplier: 2
  # 算变化率要求基准日水位 ≥ 该值，否则该列写 NULL（前端"—"）。
  # 冷门板块水位可以低到 0.04%，"从 0.0004 涨到 0.02"会算出 +5000%，
  # 数学没错但不是资金异动，且按列降序会把真异动板块全挤下去。
  min_base_water: 0.005
  # 板块成分股（ths_member）并发抓取线程数 / 失败重试次数
  member_workers: 6
  member_retry_times: 2
  # 成分股本地缓存有效天数（全量抓一次约 4 分钟，别每次算都重抓）
  member_cache_days: 30
  # 每周几自动算（仅文档用途；实际 cron 在 src/scheduler/registry.py）
  flow_weekday: 2
  # 周频 4 列**只算看板默认视图真正渲染的板块**。
  #
  # 为什么收：改之前对全量算 —— 实测一周 1479 个，而看板默认视图只渲染
  # 262 个，即 82.3% 的计算结果从来没被渲染过（4 列只出现在看板表格里）。
  #
  # ⚠️ 这不等于主线那套「20 日胜率」门槛：拥挤度刻意保留行业指数
  # （"以后想看行业拥挤度不用重跑 6 年"），所以这里收的是**看板可见性**，
  # 不是题材优劣。
  #
  # 代价：被移出清单（visible=0）的板块 4 列停止更新（已落库的历史行不动，
  # 加回清单后下次重算即可补上）。回填历史周 / 做对照实验时设为 false。
  pool_only: true
  # 收口时**是否只算概念板块**。
  #
  # ⚠️ 2026-09-27 改回 **false** —— 之前设 true 是**算反了**：
  #   「只看概念板块」勾选框默认勾上，所以按它收口看起来合理，
  #   但实测 `sector_crowding_list` 的 `visible=1` 554 个板块拆开是：
  #
  #       source='default' + 概念   257 个   ← 系统种子
  #       source='manual'  + 非概念 292 个   ← **用户手动添加的**
  #       source='manual'  + 概念     5 个   ← 用户手动添加的
  #
  #   也就是说 `true` 会**算系统塞进来的、不算用户自己配的**，正好反了。
  #
  # 用户 2026-09-27 定的规则：
  #   * **前端已配置（visible=1）** → 提前算，打开页面直接有数据，不等
  #   * **非配置的** → 用户新增到前端时，**临时算**
  #     （`metrics.compute_metrics_for_codes()`，挂在 `/config_list` 新增/恢复上）
  #
  # 所以预计算范围 = **已配置且可见**，不做概念过滤。
  pool_concepts_only: false

# ---------------------------- [日志] ----------------------------------------
logging:
  level: "INFO"
  # 刷新日志目录（每个板块的起止日期/新增条数/耗时写入这里）
  dir: "logs"
  file_name: "sector_crowding.log"
