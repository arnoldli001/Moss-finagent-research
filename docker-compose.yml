# Demo本地依赖：PostgreSQL + Redis（DEPLOYMENT.md 3.2）

services:
  postgres:
    image: postgres:14
    container_name: finagent-postgres
    environment:
      POSTGRES_USER: finagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finagent}
      POSTGRES_DB: finagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finagent-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
