<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Moss 投研平台 · 侧边栏改版效果图（静态稿）</title>
<style>
/* ==================================================================
   侧边栏改版 · 静态效果图
   ------------------------------------------------------------------
   这份稿子的用途是**确认布局与信息层级**，不是最终视觉。所以：
     · 数据全是示意值（不接任何接口）
     · 交互只有"点侧边栏切页"，其余是静态的
     · 每组页面只放该页**最有代表性的** 1~2 块内容，不追求齐全
   颜色沿用现有前端（深色 + 蓝色强调 + 红涨绿跌），方便和现状对照。
   ================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #0d0f13;
  color: #e6e8eb;
  font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
button { font: inherit; cursor: pointer; }

/* ── 外壳：左导航 + 右内容 ── */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

/* ── 左侧导航 ── */
.side {
  background: #14171c;
  border-right: 1px solid #23272f;
  display: flex; flex-direction: column;
  min-width: 0;
}
.brand {
  display: flex; align-items: center; gap: 9px;
  padding: 14px 16px; border-bottom: 1px solid #23272f;
}
.brand-logo {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: linear-gradient(135deg, #4a9eff, #2b6fd4);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.brand-t { font-weight: 600; font-size: 13.5px; letter-spacing: .2px; }
.brand-s { font-size: 10.5px; color: #6f7c8a; }

.nav { padding: 10px 8px 16px; overflow-y: auto; }
.grp { margin-top: 12px; }
.grp:first-child { margin-top: 2px; }
.grp-h {
  font-size: 10.5px; color: #6f7c8a; letter-spacing: .08em;
  padding: 0 10px 6px; text-transform: none;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  background: none; border: 0; color: #b9c2cc;
  padding: 8px 10px; border-radius: 7px;
  font-size: 13px; line-height: 1.3;
  border-left: 2px solid transparent;
}
.nav-item:hover { background: #1b1f26; color: #e6e8eb; }
.nav-item.on {
  background: #17243a; color: #eaf2ff; font-weight: 600;
  border-left-color: #4a9eff;
}
.nav-ic {
  width: 17px; text-align: center; flex: none;
  color: #7d8b9a; font-size: 12.5px;
}
.nav-item.on .nav-ic { color: #4a9eff; }
.nav-badge {
  margin-left: auto; font-size: 10.5px; padding: 0 6px;
  border-radius: 999px; background: #253048;
  color: #9dc0f5; font-variant-numeric: tabular-nums;
}
.nav-badge.warn { background: #3a2a1c; color: #f0b070; }
.side-foot {
  margin-top: auto; padding: 10px 14px; border-top: 1px solid #23272f;
  font-size: 11px; color: #6f7c8a; display: flex; gap: 8px; align-items: center;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #2ea86e; flex: none; }
.dot.warn { background: #d9a13b; }

/* ── 顶部条 ── */
.main { display: flex; flex-direction: column; min-width: 0; }
.top {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; border-bottom: 1px solid #23272f;
  background: #101318; position: sticky; top: 0; z-index: 5;
}
.page-title { font-size: 15.5px; font-weight: 600; }
.page-sub { font-size: 11.5px; color: #6f7c8a; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill {
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid #2a3038; color: #9aa6b3;
}
.pill.ok { border-color: #245a3f; color: #59c98d; background: #10261c; }
.pill.warn { border-color: #5a4624; color: #e0b063; background: #241d10; }
.btn {
  background: #1b2028; color: #cfd6de; border: 1px solid #2a3038;
  border-radius: 7px; padding: 5px 11px; font-size: 12px;
}
.btn.primary { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }

/* ── 内容区 ── */
.content { padding: 14px 18px 28px; display: flex; flex-direction: column; gap: 12px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.card {
  background: #14171c; border: 1px solid #23272f; border-radius: 10px;
  padding: 12px 14px; min-width: 0;
}
.card-h {
  display: flex; align-items: baseline; gap: 9px; margin-bottom: 9px;
  font-size: 13px; font-weight: 600;
}
.card-h .muted { font-weight: 400; }
.muted { color: #6f7c8a; font-size: 11.5px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
.kpi {
  background: #14171c; border: 1px solid #23272f; border-radius: 9px;
  padding: 9px 11px; min-width: 0;
}
.kpi-l { font-size: 11px; color: #6f7c8a; }
.kpi-v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi-v small { font-size: 11px; color: #6f7c8a; font-weight: 400; margin-left: 2px; }
.kpi-f { font-size: 10.5px; color: #6f7c8a; }

/* 表 */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 11px; color: #6f7c8a; font-weight: 400;
  padding: 6px 8px; border-bottom: 1px solid #23272f; white-space: nowrap;
}
td { padding: 7px 8px; border-bottom: 1px solid #1c2027; font-size: 12.5px; }
tbody tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: #8b98a5; }
.up { color: #e5484d; }   /* 红涨 */
.down { color: #2ea86e; } /* 绿跌 */

/* 标签 */
.tag {
  display: inline-block; font-size: 11px; padding: 1px 7px;
  border-radius: 5px; border: 1px solid #2a3038; color: #9aa6b3; white-space: nowrap;
}
.tag.bull { border-color: rgba(229,72,77,.5); color: #e5484d; }
.tag.bear { border-color: rgba(46,168,110,.5); color: #2ea86e; }
.tag.neu { border-color: rgba(139,152,165,.4); }
.tag.blue { border-color: rgba(74,158,255,.45); color: #6cb0ff; background: rgba(74,158,255,.1); }
.tag.purple { border-color: rgba(169,123,255,.45); color: #b28cff; background: rgba(169,123,255,.1); }
.tag.orange { border-color: rgba(224,138,60,.45); color: #e08a3c; background: rgba(224,138,60,.1); }
.tag.green { border-color: rgba(46,168,110,.45); color: #2ea86e; background: rgba(46,168,110,.1); }

/* 条状 */
.bar { height: 5px; border-radius: 3px; background: #23272f; overflow: hidden; min-width: 40px; }
.bar > i { display: block; height: 100%; background: #4a9eff; }
.bar.red > i { background: #e5484d; }
.bar.green > i { background: #2ea86e; }

/* 一行内联 */
.row { display: flex; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 7px; }
.hr { height: 1px; background: #23272f; margin: 9px 0; }

/* 进度/公式块 */
.formula {
  background: #101318; border: 1px dashed #2a3038; border-radius: 8px;
  padding: 8px 10px; font-family: ui-monospace, Consolas, monospace;
  font-size: 11.5px; color: #9aa6b3; line-height: 1.7; overflow-x: auto;
}
.tl { display: flex; flex-direction: column; gap: 0; }
.tl-row { display: grid; grid-template-columns: 52px 1fr; gap: 9px; padding: 5px 0; font-size: 12px; }
.tl-t { color: #6f7c8a; font-variant-numeric: tabular-nums; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ea86e; }
.tl-dot.wait { background: #d9a13b; }
.tl-dot.pur { background: #a97bff; }

.legend {
  font-size: 11px; color: #6f7c8a; border-top: 1px dashed #23272f;
  padding-top: 8px; margin-top: 4px; line-height: 1.7;
}
.note {
  background: #1a1508; border: 1px solid #4a3a1c; border-radius: 8px;
  padding: 7px 10px; font-size: 11.5px; color: #d8b878; line-height: 1.6;
}
.mock-watermark {
  position: fixed; right: 10px; bottom: 8px; z-index: 50;
  font-size: 10.5px; color: #4a545f; background: #0d0f13cc;
  padding: 3px 8px; border-radius: 6px; border: 1px solid #23272f;
}

/* ==================================================================
   手机形态：三种，见文档说明
   ================================================================== */
/* 手机竖屏：抽屉式 */
.m-portrait .shell { grid-template-columns: minmax(0, 1fr); }
.m-portrait .side {
  position: fixed; inset: 0 auto 0 0; width: 246px; z-index: 20;
  transform: translateX(0); box-shadow: 0 0 40px #000a;
}
.m-portrait.drawer-closed .side { transform: translateX(-100%); }
.m-portrait .scrim {
  position: fixed; inset: 0; background: #0009; z-index: 15;
}
.m-portrait.drawer-closed .scrim { display: none; }
.hamburger {
  display: none; background: none; border: 0; color: #cfd6de;
  font-size: 17px; padding: 0 4px;
}
.m-portrait .hamburger, .m-landscape .hamburger { display: block; }

/* 手机横屏 / 平板：纯图标轨道 */
.m-landscape .shell, .m-tablet .shell { grid-template-columns: 54px minmax(0, 1fr); }
.m-landscape .side, .m-tablet .side { width: 54px; }
.m-landscape .brand-t, .m-landscape .brand-s,
.m-landscape .grp-h, .m-landscape .nav-item > span:not(.nav-ic),
.m-landscape .nav-badge, .m-landscape .side-foot span,
.m-tablet .brand-t, .m-tablet .brand-s,
.m-tablet .grp-h, .m-tablet .nav-item > span:not(.nav-ic),
.m-tablet .nav-badge, .m-tablet .side-foot span { display: none; }
.m-landscape .nav-item, .m-tablet .nav-item {
  justify-content: center; padding: 10px 0; gap: 0;
}
.m-landscape .brand, .m-tablet .brand { justify-content: center; padding: 12px 0; }
.m-landscape .side-foot, .m-tablet .side-foot { justify-content: center; padding: 10px 0; }
.m-landscape .grp, .m-tablet .grp { margin-top: 6px; }
.m-landscape .nav { padding: 6px 5px 12px; }
.m-tablet .nav { padding: 6px 5px 12px; }

/* 竖屏手机上的内容：单列、KPI 两列 */
.m-portrait .cols2, .m-portrait .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.m-portrait .cols2 > * { grid-column: 1 / -1; }
.m-portrait .kpis { gap: 8px; }
.m-portrait .content { padding: 11px 12px 24px; }
.m-portrait .top { padding: 9px 12px; gap: 8px; }
.m-portrait .page-title { font-size: 14.5px; }
.m-landscape .content { padding: 9px 12px 16px; }
.m-landscape .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; }
.m-landscape .top { padding: 6px 12px; }
.m-landscape .cols2 { grid-template-columns: minmax(0, 1fr) 260px; }
.scrollhint { display: none; }

/* ── 竖屏手机：顶栏必须"收"（第一版这里是坏的） ──
   实测 390px 下，原来那套「标题 + 2 个状态胶囊 + 2 个按钮」会：
     · 标题被挤成 3 行（"公开信息聚合 · 统 / 计量 · 公式参考"）
     · 胶囊竖着断字（"采 集 正 常"）
     · 表格最右列被切掉
   最终设计：顶栏只留 **标题（一行省略）+ 一个状态点 + ⋯ 溢出菜单**，
   其余全部收进溢出菜单。状态胶囊在手机上本来就信息量低
   （"采集正常"是默认态，异常时那个点会变黄/红，足够）。 */
.m-portrait .top > div:first-of-type { min-width: 0; flex: 1 1 auto; }
.m-portrait .page-title {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.m-portrait .page-sub { display: none; }
.m-portrait .top-right { gap: 4px; flex: none; }
.m-portrait .top-right .pill { display: none; }
.m-portrait .top-right .pill.warn {
  display: inline-block; font-size: 10px; padding: 1px 6px;
}
.m-portrait .top-right .btn:not(.overflow) { display: none; }
.btn.overflow { display: none; }
.m-portrait .btn.overflow { display: block; padding: 5px 9px; }

/* ── 竖屏手机：表格横向滑动，并给出可见提示 ──
   数据表（7 列）在 390px 上不可能塞下。选择"可横向滑动 + 显式提示"，
   而不是"砍列" —— 砍列会让用户以为系统缺数据。
   ⚠️ 滚动条在手机上不可见，所以提示必须**写出来**，
   否则用户不知道右边还有内容（这正是现在顶栏页签的问题）。 */
.m-portrait .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.m-portrait table { min-width: 420px; }
.m-portrait .scrollhint {
  display: block; font-size: 10.5px; color: #6f7c8a;
  padding: 5px 2px 0;
}
/* 竖屏隐掉**次要列**（`.hide-m`）—— 这是"砍列"而不是"横向滑动"，
   两者都要有：
     · 砍列：表格回到能读的宽度（7 列里"来源类型/可信度"是次要的）
     · 滑动：剩下的列仍可能超宽（如"标题摘要"很长），滑动能看全
   ⚠️ 只砍**次要**列。砍掉主要列会让用户以为系统缺数据。 */
.m-portrait .hide-m { display: none; }
/* 竖屏列宽全部放开：固定 px 列宽在 390px 上会把标题挤成每行 5 个字
   （实测："伊朗媒体：伊 / 拉克纳杰夫机 / 场暂停往返伊…"） */
.m-portrait table th, .m-portrait table td { white-space: normal; }
</style>
</head>
<body>

<!-- 侧边栏（唯一一份，被所有形态复用） -->
<template id="side-tpl">
  <div class="brand">
    <div class="brand-logo">M</div>
    <div>
      <div class="brand-t">Moss 投研平台</div>
      <div class="brand-s">多 Agent 投研工作台</div>

  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <span class="dot" id="foot-dot"></span>
    <span id="foot-t">后端在线 · 8110</span>
  </div>

<div id="app"></div>
<div class="mock-watermark">静态效果图 · 数据为示意值 · 不可交互</div>

<script>
/* ==================================================================
   NAV：四组。这就是本次改版的核心 —— 把 9~14 个扁平页签收进 4 组。
   ================================================================== */
const NAV = [
  { g: "投资分析", items: [

  ]},

    { id: "screen",    ic: "▥", t: "量化选股" },
    { id: "auction",   ic: "▧", t: "集合竞价选股" },
    { id: "tplus",     ic: "▨", t: "做 T 辅助" },
  ]},
  { g: "情报", items: [
    { id: "intel",     ic: "◎", t: "情报中心", badge: "171" },
    { id: "brief",     ic: "▦", t: "盘前简报" },
    { id: "alerts",    ic: "⚠", t: "事件告警中心", badge: "23", warn: true },
  ]},
  { g: "平台", items: [
    { id: "pools",     ic: "◫", t: "我的自选池" },
    { id: "sched",     ic: "⚙", t: "调度与任务" },
    { id: "audit",     ic: "☰", t: "审计与合规" },
    { id: "users",     ic: "◍", t: "用户管理" },
  ]},
];

const kpi = (l, v, u, f) =>
  `<div class="kpi"><div class="kpi-l">${l}</div>` +
  `<div class="kpi-v">${v}${u ? `<small>${u}</small>` : ""}</div>` +
  `<div class="kpi-f">${f || ""}</div></div>`;
const bar = (p, cls = "") =>
  `<div class="bar ${cls}"><i style="width:${p}%"></i></div>`;
const tag = (t, cls) => `<span class="tag ${cls || ""}">${t}</span>`;

/* ==================================================================
   每个页面的内容。刻意只放"最有代表性的" 1~2 块 —— 这是结构稿，
   目的是确认**每页长什么样、信息怎么排**，不是画完所有字段。
   ================================================================== */
const PAGES = {
  research: {
    title: "AI 投研工作台", sub: "多 Agent 协作 · 全链路可溯源",
    top: [["pill ok", "采集正常"], ["pill", "上次运行 09:12"]],

          </div>

      </div>
      <div class="cols2">
        <div class="card">
          <div class="card-h">最近任务</div>
          <table><thead><tr><th>任务</th><th>Agent</th><th>耗时</th><th>状态</th></tr></thead><tbody>
            <tr><td>光伏设备主线强度分析</td><td class="code">A13 行业</td><td class="num">42.1s</td><td>${tag("已完成", "green")}</td></tr>
            <tr><td>两融周度变化归因</td><td class="code">A09 资金</td><td class="num">18.6s</td><td>${tag("已完成", "green")}</td></tr>
            <tr><td>半导体设备拥挤度回测</td><td class="code">A18 审计</td><td class="num">—</td><td>${tag("运行中", "blue")}</td></tr>
            <tr><td>盘前预测（08:10）</td><td class="code">A17 决策</td><td class="num">61.3s</td><td>${tag("已完成", "green")}</td></tr>
          </tbody></table>
        </div>
        <div class="card">
          <div class="card-h">Agent 状态</div>
          <div class="stack">
            ${["A13 行业层", "A09 资金流", "A18 审计"].map((n, i) => `
              <div class="row spread"><span>${n}</span>
                ${tag(i === 2 ? "运行中" : "空闲", i === 2 ? "blue" : "")}</div>`).join("")}
          </div>
        </div>
      </div>`,
  },

  mainline: {
    title: "板块主线挖掘", sub: "主线强度 · 拥挤度 · 资金流共振",
    top: [["pill ok", "数据 T-1"], ["pill", "刷新于 09:20"]],
    body: () => `
      <div class="kpis">${[
        kpi("识别主线", "12", "条", "强度 ≥60"),
        kpi("强主线", "3", "条", "强度 ≥80"),
        kpi("拥挤预警", "2", "条", "分位 ≥85"),
        kpi("资金净流入", "+86.4", "亿", "全市场 · 昨日"),
        kpi("北向", "+21.7", "亿", "昨日"),
        kpi("覆盖个股", "486", "只", "去重后"),
      ].join("")}</div>
      <div class="card">
        <div class="card-h">主线列表 <span class="muted">按强度降序 · 点开看成分股与证据</span></div>
        <table><thead><tr>
          <th>板块</th><th>强度</th><th style="width:110px">强度分</th>
          <th>拥挤度分位</th><th>资金流</th><th>领涨龙头</th><th>信号</th>
        </tr></thead><tbody>
          ${[

let CUR = "intel";

function renderNav() {
  const nav = document.getElementById("nav");
  // ⚠️ 必须容忍"还没有容器"。第一版把 `renderNav()` 放在填充外壳**之前**，
  // 首次加载时 `#nav` 不存在 → 抛 TypeError → 整个渲染脚本挂掉，
  // 页面只剩空白（而 Playwright 不会因为 JS 报错就失败，所以看起来像"截图没内容"）。
  if (!nav) return;
  nav.innerHTML = NAV.map((g) => `
    <div class="grp">
      <div class="grp-h">${g.g}</div>
      ${g.items.map((it) => `
        <button class="nav-item${it.id === CUR ? " on" : ""}" data-p="${it.id}">
          <span class="nav-ic">${it.ic}</span>
          <span>${it.t}</span>
          ${it.badge ? `<span class="nav-badge${it.warn ? " warn" : ""}">${it.badge}</span>` : ""}
        </button>`).join("")}
    </div>`).join("");
  nav.querySelectorAll(".nav-item").forEach((b) => {
    b.onclick = () => render(b.dataset.p);
  });
}

function render(pageId) {
  if (PAGES[pageId]) CUR = pageId;
  const p = PAGES[CUR];
  const form = document.body.className || "";
  // ★ 顺序：先建外壳 → 再填导航。反过来会拿到上一轮的 DOM（或什么都没有）。
  document.getElementById("app").innerHTML = `
    ${form.includes("m-portrait") ? '<div class="scrim"></div>' : ""}
    <div class="shell">
      <aside class="side">
        <div class="brand">
          <div class="brand-logo">M</div>
          <div>
            <div class="brand-t">Moss 投研平台</div>
            <div class="brand-s">多 Agent 投研工作台</div>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="side-foot"><span class="dot"></span><span>后端在线 · 8110</span></div>
      </aside>
      <div class="main">
        <header class="top">
          <button class="hamburger">☰</button>
          <div>
            <div class="page-title">${p.title}</div>
            <div class="page-sub">${p.sub || ""}</div>
          </div>
          <div class="top-right">
            ${(p.top || []).map(([c, t]) => `<span class="${c}">${t}</span>`).join("")}
            <button class="btn">↻ 刷新</button>
            <button class="btn primary">立即运行</button>
            <button class="btn overflow" title="更多操作">⋯</button>
          </div>
        </header>
        ${p.sub_tabs ? `<div style="display:flex;gap:6px;padding:9px 18px 0">
          ${p.sub_tabs.map((t, i) => `<button class="btn${i === 0 ? " primary" : ""}">${t}</button>`).join("")}
        </div>` : ""}
        <div class="content">
          <div class="scrollhint">← 表格可左右滑动查看全部列</div>
          ${p.body()}
        </div>
      </div>
    </div>`;
  renderNav();
  if (form.includes("m-portrait")) {
    const hb = document.querySelector(".hamburger");
    if (hb) hb.onclick = () => document.body.classList.toggle("drawer-closed");
    const sc = document.querySelector(".scrim");
    if (sc) sc.onclick = () => document.body.classList.add("drawer-closed");
  }
}

window.render = render;
window.PAGE_IDS = Object.keys(PAGES);
render(CUR);
