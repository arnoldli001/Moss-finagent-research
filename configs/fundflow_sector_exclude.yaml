# 板块资金流榜 · 剔除清单
#
# 作用：`src/fundflow` 的板块榜/走势/默认热门/搜索**都不再出现**下列板块。
# 判据模块是 `src/fundflow/sector_filter.py`，调用点共 3 处（见该模块文档）。
#
# ================================================================
# 一个必须先说清的事实：**这里没有"882 开头"这回事**
# ================================================================
# 用户口径是"不要地域性板块（882 开头）江苏板块 等"。但 882xxx 是**同花顺**
# 的板块代码，而资金流榜的数据源是 Tushare `moneyflow_ind_dc`（**东财**口径），
# 板块代码形如 `BK0159.DC`：
#
#     江苏板块  BK0159.DC      富时罗素  BK0867.DC
#     融资融券  BK0596.DC      华为概念  BK0854.DC
#
# 实测两套体系在这个项目里**完全不重叠**：`ml_board`（主线挖掘池）
# 只有 885/886 开头的 161 个代码，**一个 882/883 都没有**
# （`configs/sector_blacklist.yaml` 头部记着"按用户口径不纳入 882/883 开头的
# 行业指数"，所以它们本来就没进池）。而资金流榜的 1030 个板块全是 BK 代码。
#
# 所以"地域性板块"只能**按名称识别**，不能按代码前缀识别。下面每一类都
# 是**在真实板块池上逐个核过名称**的显式清单 —— 刻意不做关键词匹配。
#
# ================================================================
# 为什么用显式清单，而不是关键词/正则
# ================================================================
# 我先用宽口径关键词跑了一遍全池（1030 个），实测**立刻误伤两个正常板块**：
#
#     汽车一体化压铸   命中"一体化"    —— 它是一体化压铸工艺，明确行业
#     重组蛋白         命中"重组"      —— 它是生物制药细分，明确行业
#
# 这两个板块被静默剔除后，榜单上只是"少了两个"，**不会报任何错** ——
# 与 `configs/sector_blacklist.yaml` 头部担心的那类问题同源。
# 因此本清单只登记**逐个看过名称**的板块；要加新的，先确认它不是
# "名字里恰好含某个词"的正常行业板块。
#
# ================================================================
# 扫描方式：关键词扫描**本身也会漏**，所以要"宽口径扫 + 逐个过目 + 反向校验"
# ================================================================
# 本清单实际做了三轮，第一轮漏了 14 个 —— 记下来是因为这个坑一定会重演：
#
#   第一轮：按类别关键词扫描 1030 个板块
#           漏掉 `中证500` / `深成500` / `创业板综` / `上证380` / `深证100R`
#           （它们**不带** `_` 后缀，而我只按 `HS300_` 那种形状写的规则）、
#           `标准普尔`（我写的是"标普"，名字里其实是"普尔"）、
#           `百元股` / `趋势股` / `破发股` / `题材股` / `东方财富热股` /
#           `科创板做市商` / `科创板做市股` / `GDR`。
#   第二轮：用**更宽**的口径重扫（含"指数/上证/深证/中证/成份/百元/趋势…"），
#           补 11 个。
#   第三轮：对**剔除后剩下的 910 个**再扫一遍（含"热股/人气/题材/破发…"），
#           补 3 个；剩下的唯一命中项 `重组蛋白` 经确认是正常行业板块，保留。
#
# 三条可复用的做法：
#   1. **扫两遍**：一遍扫全集，一遍扫"剔除后的残渣" —— 只扫全集会把
#      第一轮规则没覆盖到的形状整类漏掉。
#   2. **命中项逐个过目**，不要直接落库：宽口径必然误伤（实测误伤
#      `汽车一体化压铸`、`重组蛋白`）。
#   3. **补录代码必须从数据源实际值抄**，不能按序号猜：本轮我猜过
#      `BK0486.DC` 想指"标准普尔"（实际是**传媒**）、`BK1622.DC` 想指
#      "科创板做市商"（实际是**镍**）、`BK1623.DC`（实际是**钼**）——
#      名称匹配不上、代码却命中，被删的会是真行业板块。
#      现在 `sector_filter.verify_codes()` 每次组装都会对一遍并在界面上报错。
#
# ================================================================
# 读不到配置时的行为：**放行全部**（fail-open）
# ================================================================
# 文件缺失/损坏时返回空清单，并在 `source_notes` 里写明 —— 也就是退回
# 加这个功能之前的行为。方向是刻意选的：
#   * 放行 = 用户重新看到地域板块（难看，但界面完整、能干活）；
#   * 全部剔除 = 榜单空白，用户会以为数据源坏了，排查方向完全错。
# 与 `sector_blacklist.yaml` 的"读不到时回退 visible=1 并写明"同一考虑。
#
