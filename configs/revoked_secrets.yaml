# **撤回清单**：已经泄漏过、从此不许再出现的具体凭据值（2026-10-02 起）
#
# 为什么存哈希不存明文：把明文写在这里等于**把泄漏再发布一次**，
# 而且还额外标注了'这是口令'。存 sha256 前 16 位既能匹配又不复制秘密。
#
# 为什么需要它：形态规则（'像不像口令'）必须有键名或语境才能判，
# 而实测 22 处泄漏里有 2 处是**裸字面量** —— 例如
# `pg.fill('input[placeholder="输入密码"]', "<真口令>")`。
# 撤回清单是**精确字符串**比对：零误报，语义也正是安全上要的那句话。
#
# 注意：撤回清单**不吃路径豁免** —— 测试夹具里同样不许抄真口令。
#
# 维护：口令轮换后把旧值加进来（`scripts/_gen_revoked_secrets.py`）。
# 判据：`tests/unit/test_no_secrets_in_tracked_tree.py`。
