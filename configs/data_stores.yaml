# 本地存储清单 —— **单一事实源**（CHG-0066 / PRD §16）
#
# 为什么要有这个文件（一次真实报障换来的）：
#   项目里曾同时存在 **3 份"本地有什么"的清单**，各自用不同的枚举方式、
#   各自漏掉不同的一块，于是 pilot 的投研取数"查不到"：
#     · `assets.py` 的 `data_asset_catalog` 只扫 `settings.sqlite_path` **一个库**
#     · `ColumnIndex` 递归 `data/**.db`，但**按名字跳过 `warehouse.db`**
#       *且*受 8 GiB 体积上限（行情仓 14.36 GiB）→ **双重跳过**
#     · `TABLE_FREQUENCY` / `DIR_FREQUENCY` 是**手写**的，没有 `quant_daily*`
#   同时有 **3 套库路径解析器**（`settings.sqlite_path` / `WarehouseConfig.from_env()`
#   / 模块自带 config.yaml 硬编码），`src/` 里散着 67 处路径字面量。
#
# 本文件就是"**库在哪、谁能写、能不能删**"的唯一答案。**新增存储必须在这里登记**，
# 否则 `tests/unit/test_store_registry.py` 会红灯（而不是静默漏掉）。
#
# ---------------------------------------------------------------------------
# 字段口径
# ---------------------------------------------------------------------------
#   name        引用键（代码里 `resolve_store("<name>")`）
#   kind        sqlite | dir | file
#   path        sqlite/file：相对仓库根的路径；dir：目录
#               ★ 支持 `{env_root}` 占位符 = 该环境自己的数据根（见 isolation=per_env）
#   isolation   shared  = 所有环境共用同一份（市场数据，**有意共用**）
#               per_env = 每个环境一份（应用库/缓存/审计/调度）
#   writer      唯一写者：main（主实例）| own（本环境实例）
#               | dev / test / pilot（**点名到具体环境**，见 CHG-0087）| none（只读）
#               ★ 口径（用户 2026-09-29 裁定）：
#                 「共享行情仓，dev 读，pilot 写和读。
#                   同时看下更新数据是谁负责的，**谁负责更新数据谁有写权限**。」
#                 → writer 写的是**承担更新责任的那个环境**，不是"主实例"这类
#                   模糊说法。写权限跟着**责任**走：负责更新的人拿写权，
#                   其余实例一律只读（`writable_here()` 直接拒绝，不只是提示）。
#                 → 连带效果：更新作业（`JobSpec.updates` 声明了本存储的那些）
#                   在非写者实例上**根本不会被触发**（否则每次都会撞写闸门失败，
#                   把运行台账刷成一片红 —— 而那不是故障，是这台机器不负责这件事）。
#   writable    是否允许本项目的任何进程写入（protected 的补充语义）
#   protected   **不得删除**（清理口径不得覆盖）。用户 2026-09-28 明确声明：
#               「data/quant/warehouse.db 14.36 GiB 这是我行情数据库
#                 不能随便删，前端要用的」
#   role        source（外部采集来的）| derived（本系统算出来的）
#               | dim（维度/映射）| ops（运维/用户）
#               —— 决定它该不该参与"取本地还是联网"的路由（同 assets.TABLE_ROLE_RULES）
#   time_column 新鲜度判据列（可空）
#   note        人话说明（会被 `/health` 与审计脚本原样展示）
# ---------------------------------------------------------------------------
# 同一物理文件被多条登记指向时的**治理字段**（`CHG-0144`，用户 2026-09-30 裁定）
# ---------------------------------------------------------------------------
# 现场：`app_db` / `legacy_main` / `crowding_shared` **三条登记指向同一个文件**
# `data/moss_finagent.db`（前者的 `main_path` 在未注入 `MOSS_SQLITE_PATH` 时回落
# 到它）。不声明关系的话，三条看起来像"三个各自独立的库"，于是同一个文件的
# `protected` / `writer` 各写一份、互相矛盾而没人发现。
#
#   canonical_for_file  ★ 治理字段：本条目是 `path` 所指**物理文件**的权威登记。
#                       同一物理文件的多条登记里**最多一条**为 true，且该文件级的
#                       属性（`protected`）**只在这一条上声明** —— 其余条目不得
#                       再写第二份（同一个文件不能既受保护又不保护）。
#   alias_of            本条目**不是另一个库**，而是 `<canonical>` 那份**同一个
#                       文件**的另一张"表范围"视图（表不同、写者可以不同，
#                       文件是同一个）。文件级属性**继承** canonical。
#   main_path_alias_of  `isolation: per_env` 专用：`main_path` 那次**回落到**的登记
#                       名 —— 即"只在主实例那条回落路径上与它同文件"。本条自己的
#                       `protected` 只描述 `path`（本环境的 `moss_<env>.db`）。
#   writer_scope        写权的**范围**（表名 / 表前缀 / 补集说明）。★ 同一物理文件
#                       上出现两个不同的 `writer` 时**两边都必须写**，且范围必须
#                       互不相同 —— 否则"谁写哪张表"就是两处各说各的裸字段。
#
# ⚠️ 这三个 `*_of` / `canonical_for_file` / `writer_scope` **只被治理判据读**
# （`tests/unit/test_store_governance.py` 与 `scripts/_audit_store_governance.py`
# 读原始 YAML），`data_stores.Store` 不认识它们 ⇒ **零运行期行为变更**。
# ---------------------------------------------------------------------------

version: 1
updated: "2026-09-30"

stores:
  # ======================= 数据库 =======================

  - name: app_db
    kind: sqlite
    path: "{env_root}/moss_{env}.db"
    main_path: "data/moss_finagent.db"
    # ★ 主实例那条回落路径与 `legacy_main` 是**同一个文件**，这里显式声明这条关系
    #   （而不是让两条登记看起来像两个库）。
    #
    #   代码事实：`Store.resolved()` **只在** `is_main_instance()` 为真时才取
    #   `main_path`（src/infrastructure/catalog/data_stores.py:107-108），而
    #   `is_main_instance()` 的判据是"没注入 `MOSS_SQLITE_PATH`，或注入的指向
    #   legacy_main 的文件名"（同文件 :164-180）。
    #   ⇒ 三档隔离实例（dev/test/pilot）下本条目**不指向** `data/moss_finagent.db`。
    #
    #   `protected` 的口径由此继承：本条的 `protected: false` **只描述 `path`**
    #   （`data/<env>/moss_<env>.db` 那三个文件不受保护）；一旦回落到
    #   `main_path`，那个文件受不受保护由它的 canonical `legacy_main` 说了算
    #   （= `protected: true`）。判据见
    #   tests/unit/test_store_governance.py::test_main_path_fallback_inherits_canonical_protection
    main_path_alias_of: legacy_main
    isolation: per_env
    writer: own
    writable: true
    protected: false
    role: ops
    note: >-
      应用库：账号/会话/告警/事件/自选/池子/选股结果/主线结果/索引。
      由 `MOSS_SQLITE_PATH` 注入（`manage.py` 的 dev/test/pilot 三档隔离）。
      **主实例**（未注入）沿用 `data/moss_finagent.db`（= `legacy_main` 那份文件，
      见上面的 `main_path_alias_of`），与改动前的行为**逐字一致**。
      ⚠️ 默认值是遗留主库这一点曾被写成代码字面量 —— 于是"漏传 db_path 就写到共享库"；
      现在由本文件表达，`default_app_db()` 默认取**本环境**的库（CHG-0069 / CHG-0071）。

  - name: warehouse
    kind: sqlite
    path: data/quant/warehouse.db
    isolation: shared
    # ★ 唯一写者 = **pilot**（用户 2026-09-29 裁定：谁负责更新数据谁有写权限）。
    #
    # 为什么是 pilot 而不是 main：实测（2026-09-28 夜间）三个实例的调度器
    # **都在**跑 `quant_data_sync` —— `data/dev/scheduler` 33 条（最后 23:30:03）、
    # `data/pilot/scheduler` 43 条（最后 23:30:02）、`data/scheduler` 7 条 ——
    # 也就是 dev 与 pilot 在**同一分钟**往同一个 14.36 GiB 的库里 upsert。
    # 而 pilot 是**对外那个实例**（hk.wujiaitool.cn，前端直接就靠它），
    # 更新责任落在它身上，dev 降为只读。
    #
    # ⚠️ 后果要说清楚：**主实例（未注入 MOSS_ENV 的那个，现未运行）也变成只读**
    # —— `data/scheduler` 里那 7 条 `quant_data_sync` 记录不会再增长。
    # 这是有意的（一个共享文件一个写者）。要改回来只需改这一个字段。
    writer: pilot
    writable: true
    protected: true
    role: source
    time_column: trade_date
    note: >-
      **共享行情仓**（14.36 GiB，Tushare 口径）。`quant_daily` 1,542 万行、
      `quant_daily_basic` 1,542 万行，2006-01-04 起、更新到最近交易日。
      **它是全项目唯一权威的行情日频库** —— 日K补充字段（换手率/资金净流入）、
      股票名录、板块行情、回测、以及 `_quant_column_points` 的估值列都读它。
      ⚠️ 曾被三份清单同时漏掉（按名字 + 8 GiB 上限双重跳过），
      于是"库里有 1500 万行，Agent 一条看不到"。

  - name: legacy_main
    kind: sqlite
    path: data/moss_finagent.db
    # ★★ 本条目是 `data/moss_finagent.db` 这个**物理文件**的权威（canonical）登记。
    #
    # 判据不是"谁的 note 写得更全"，而是**线上展示实际取谁**（用户 2026-09-30 裁定：
    # 「同路径先看下线上展示的数据取自谁，谁就更权威，应该是 legacy_main」）。
    # 实测（2026-09-30，本机）：
    #   · pilot（对外实例）的应用库是 `data/pilot/moss_pilot.db`
    #     （manage.py:1161 注入 `MOSS_SQLITE_PATH`；实测 `resolve_store("app_db")`
    #      = data/pilot/moss_pilot.db）；
    #   · 但同一批参考表**只**从**本条目**读：前端的概念/行业拥挤度看板走
    #     `platform_data_connector._TABLE_CANDIDATES`，而
    #     `sector_crowding_daily` / `sector_crowding_max_ma5` 的首选就是
    #     `legacy_main`（platform_data_connector.py:258 / :271），
    #     且该连接器**按候选顺序取第一个真的有这张表的存储**（:560-578）
    #     —— 实测（2026-09-30，本机 53/41/42 张表）：
    #       · `data/moss_finagent.db` 有 `sector_crowding_daily` / `sector_meta` /
    #         `sector_crowding_max_ma5` / `sector_member`；
    #       · **pilot 的 `data/pilot/moss_pilot.db` 与 dev 的库这 4 张表全部没有**
    #         ⇒ 线上展示要落回这个文件，用的 key 只能是 `legacy_main`。
    #
    # ⇒ 同一文件上"哪条登记是权威" = 本条目；文件级属性 `protected`
    #   **只在这里声明一次**（下面两条 `*_of` 本条目都不写）。
    canonical_for_file: true
    isolation: shared
    writer: main
    # 写权范围：本文件的写者**按表切分**（见 `crowding_shared.writer: dev`）——
    # 不得两处各留一个裸 `writer` 而没人解释"谁写哪张表"。
    writer_scope: "该文件里除 `crowding_shared` 声明的那批表之外的其余表"
    writable: true
    protected: true
    role: source
    time_column: period_date
    note: >-
      **遗留主库**（2.4 GiB）。`reset_admin_password.py` 称它"遗留空库"——
      **那个标签只对认证表成立**（18 张为空）；它的 `fact_data_points` 是
      **全项目覆盖最全**的一份（756 指标 / 199.8 万行）。
      ⚠️ **不得据"空库"标签判定整库可删**（CHG-0060）。已回填 127 万行到 pilot。
      ★ 本条目是 `data/moss_finagent.db` 的 canonical 登记（见上面
      `canonical_for_file`）：`crowding_shared` 是同一文件的表范围视图，
      `app_db` 只在主实例回落路径上与它同文件。

  - name: mainline_cache
    kind: sqlite
    path: data/mainline_cache.db
    isolation: shared
    writer: main
    writable: true
    protected: false
    role: source
    note: >-
      主线挖掘数据仓（906 MiB）：板块指数/资金流/两融/北向/龙虎榜/ETF/宏观/期货。
      回测与实盘**共用同一份输入**（`src/mainline/datastore.py`）。

  - name: crowding_shared
    kind: sqlite
    path: data/moss_finagent.db
    # ★ 本条目**不是另一个库** —— 是 `legacy_main` 那份**同一个文件**的另一张
    #   "表范围"视图（同一个物理文件、不同的表、不同的写者）。
    #   文件级属性 `protected` **继承** canonical（`legacy_main.protected: true`），
    #   所以这里**不写第二份**：写成 `false` 就是"同一个文件既受保护又不保护"，
    #   写成 `true` 又会让 `protected_stores()` 出现同路径两条
    #   （判据 test_store_registry.py::test_protected_stores_are_declared_and_intact
    #   直接红，且 `/health` 的 protected 名单属运行期行为）
    #   —— 两条路都不对，唯一自洽的做法是**只留一个声明点**。
    alias_of: legacy_main
    isolation: shared
    # ★ 唯一写者 = **dev**（用户 2026-09-30 裁定）。
    #
    # ## 为什么必须有这一条（`CHG-0143`）
    #
    # 拥挤度的表原先**根本没登记**，而写者闸门是从登记派生的
    # （`JobSpec.updates × writable_here()`）—— 于是：
    #   · 前端的「一键刷新」（`POST /sector_crowding/refresh_all`）
    #     往这个共享库里 UPSERT 218 万行，**不受任何闸门管**；
    #   · `/health` 与 `describe()` 里也看不见它。
    # ⚠️ 登记本身**还不构成强制** —— 全仓库只有 `QuantWarehouse` 调
    # `writable_here()`。所以同时给 `db.get_db_connection` 加了 `writable=`
    # 参数（默认 `False`=安全侧）；**两处一起才真正生效**。
    #
    # ## 为什么写者点名为 `dev`，而不是 `pilot` 或 `main`
    #
    #   · `main` → `writable_here()` 对隔离档只能给 `decided=False`
    #     （"口径待裁定"），**只报告不阻断** ⇒ 闸门形同虚设，等于没做；
    #   · `pilot` → 一次刷新要回填近 6 年、跑几分钟，而 pilot 是**对外实例**，
    #     重活会占它的事件循环（`CHG-0139` 刚把 4 个重作业从它挪走）；
    #     且实测刷新历来是**本机**在跑（`sector_meta.updated_at` 的写入者）。
    #   ⇒ 写者 = `dev`；pilot 点刷新会被 fail-closed 拒并给出人话理由。
    #
    # ⚠️ 它只有**参考数据**（`sector_crowding_daily` / `sector_meta` /
    # `sector_crowding_max_ma5` / `sector_member`）。
    # **用户配置**（`sector_crowding_list` / `_watch` / `_alert`）**不在这里** ——
    # 它们已迁到本环境的 `app_db`（`CHG-0143`）。
    writer: dev
    # 写权范围：与 canonical 条目 `legacy_main.writer: main` 是**按表切分**的，
    # 不是两处各说各的裸字段。表名与 `src/sector_crowding/db.py:85-135` 的
    # `_REFERENCE_SCHEMA` 逐字对应（那张 DDL 才是权威，这里只是它的名字）。
    writer_scope: "sector_crowding_daily / sector_meta / sector_crowding_max_ma5 / sector_member"
    writable: true
    role: source
    time_column: trade_date
    note: >-
      共享**板块拥挤度参考数据**（同花顺 2517 个指数的日频拥挤度）。
      `sector_crowding_daily` 218 万行、`sector_meta` 2517 行、
      `sector_crowding_max_ma5`、`sector_member`。
      **没有用户维度**（无 `tenant_id`），三个环境读同一份 —— 这是对的。
      写入只发生在「一键刷新」；写者声明见上面的 `writer`。
      ★ 本条目与 `legacy_main` 是**同一个文件**（见 `alias_of`）：线上 pilot
      的概念拥挤度看板正是经 `legacy_main` 这个 key 读到这里的表。

  - name: mainline_archive
    kind: sqlite
    path: data/archive/mainline_archive.db
    isolation: shared
    writer: main
    writable: false
    protected: false
    role: derived
    note: >-
      归档库（3.4 GiB，9 张表**全是 `_bak_`**）——历次重算前的快照。
      只应人工写入；清理前需确认不再需要回溯。

  - name: archive_root
    kind: dir
    path: data/archive
    isolation: shared
    writer: main
    writable: false
    role: derived
    note: >-
      归档区（3,489 MiB / 110 文件）。放历次快照库（`mainline_archive.db`、
      `mainline_cache_archive.db`）。**只应人工写入**；清理前需确认不再需要回溯。
      登记为**目录**而不是逐个文件，是为了让"data 下还有没有没登记的库"这个判据
      不靠人肉维护清单 —— 落在本目录下的库视为已覆盖。

  - name: backups
    kind: dir
    path: data/backups
    isolation: shared
    writer: main
    role: ops
    note: >-
      破坏性操作前的备份区。命名约定 `<用途>_before_<动作>_<时间戳>.db`，
      由 `VACUUM INTO` 生成（对运行中的 WAL 库是**一致快照**，不需要停服）。
      现有：`dev_before_fossil_drop_*.db`、`pilot_before_backfill_*.db`
      以及回填的 `pilot_backfill_ids_*.txt`（可据此精确回滚）。

  # ======================= 目录型存储 =======================

  - name: tushare_partitions
    kind: dir
    path: data/quant/tushare
    isolation: shared
    writer: main
    role: source
    note: 35,788 个 CSV/parquet 分区（2.4 GiB）。行情仓的**上游**；仓不可用时回退分区。

  - name: quant_prices
    kind: dir
    path: data/quant/prices
    isolation: shared
    writer: main
    role: source
    note: >-
      全市场前复权日线（PriceStore 落盘）。`configs/indicators.yaml` 声明它供数，
      但**实测为空目录**（0 文件）—— 即"声明了来源、里面没有数据"，
      是"没量到 ≠ 量到 0"的一个现场。

  - name: quant_fundamentals
    kind: dir
    path: data/quant/fundamentals
    isolation: shared
    writer: main
    role: source
    note: 财务指标分区（含带日期的季报快照）。

  - name: auction_hist
    kind: dir
    path: data/auction_hist
    isolation: shared
    writer: main
    role: source
    note: >-
      竞价冻结录像带（178 MiB，逐日 `tick_auction_*.parquet`）。
      **竞价链唯一的免费历史来源**（QMT tick 需权限、eltdx 只有盘中实时、
      Tushare 无竞价过程）—— 删了不可再生，清理时必须排除。

  - name: cache_root
    kind: dir
    path: data/cache
    isolation: shared
    writer: main
    role: derived
    note: 派生缓存根：fundflow / intel / auction_select 预热等。

  - name: fundflow_cache
    kind: dir
    path: data/cache/fundflow
    isolation: shared
    writer: main
    role: derived
    note: 资金流横截面缓存（`stock_frame_*.parquet`）。

  - name: intel_cache
    kind: dir
    path: data/cache/intel
    isolation: shared
    writer: main
    role: derived
    note: 情报预热状态与 feed 载荷（`prewarm_state.json` / `feed_payload.json`）。

  - name: intel_bodies
    kind: dir
    path: data/intel
    isolation: shared
    writer: main
    role: source
    note: 情报正文落地（按条目哈希分片）。

  - name: backtest
    kind: dir
    path: data/backtest
    isolation: shared
    writer: main
    role: derived
    note: >-
      回测实验产物（1,264 文件 / 1,058 MiB）。"非最后一次"由**实验变体名**
      区分（`result_v3/v5a/v5b/v6d/w0/w1…`），**不是时间戳** ——
      所以自动清理找不到"旧版本"，必须由人指定哪个变体是最后一次。

  # ======================= 按环境隔离的目录 =======================

  - name: llm_cache
    kind: dir
    path: "{env_root}/llm_cache"
    main_path: "data/llm_cache"
    isolation: per_env
    writer: own
    role: derived
    note: >-
      LLM 响应缓存。**2026-09-28 起按环境隔离**（CHG-0066）—— 原先三实例共用
      `data/llm_cache`，而本项目缓存 scope **不含 provider/model**，
      共用会让跨环境对比直接失真。

  - name: llm_audit
    kind: dir
    path: "{env_root}/audit"
    main_path: "data/audit"
    isolation: per_env
    writer: own
    role: ops
    note: LLM 调用审计与哈希链（`llm_audit.jsonl` / `audit_chain.jsonl`）。

  - name: access_audit
    kind: dir
    path: "{env_root}/access_audit"
    main_path: "data/audit"
    isolation: per_env
    writer: own
    role: ops
    note: >-
      访问审计（`MOSS_AUDIT_DIR`）。⚠️ 与 `llm_audit` 的**默认值曾同为
      `data/audit`**，而 dev 只重定向了后者 → 访问审计长期写在共用目录（CHG-0066 已修）。

  - name: quant_strategies
    kind: dir
    path: data/quant/strategies
    isolation: shared
    writer: main
    role: derived
    note: >-
      策略档案目录。策略的"哪些真的跑赢过基准"要**跨策略查询**（按超额排序、
      按时段筛、按标的找），所以它们也进 `quant_strategy` 表；本目录留 JSON 快照。
      实测为空目录（0 文件）—— 是"声明了位置、还没有产物"，不是"没量到"。

  - name: gap_queue
    kind: file
    path: data/gap_queue.jsonl
    isolation: shared
    writer: main
    role: derived
    note: 决策层的**数据缺口队列**（A17 写、补数链路读）。共用是刻意的：
      缺口是"全系统缺什么"，不随环境而变。

  - name: scheduler_dir
    kind: dir
    path: "{env_root}/scheduler"
    main_path: "data/scheduler"
    isolation: per_env
    writer: own
    role: ops
    note: 定时作业运行记录（`runs.jsonl`）。

  - name: industry_metrics
    kind: dir
    path: "{env_root}/industry_metrics"
    main_path: "data/industry_metrics"
    isolation: per_env
    writer: own
    role: derived
    note: 行业指标落地（`real_industry_connector` 按 `sqlite_path` 同级解析）。

  # ======================= 共用但**已知有风险** =======================

  - name: run_dir
    kind: dir
    path: data/run
    isolation: shared
    writer: main
    role: ops
    note: >-
      ⚠️ **三实例共用**的运行时目录（日志/锁/PID/一次性探针产物）。
      已验证过一次事故：限流熔断状态文件写死这里，dev 调试出的 3 次 429
      会把线上同一跳锁 10 分钟（CHG-0053 改为按实例隔离）。
      本目录仍在共用名单里 —— 属审计项 **A7**，待用户裁定。
