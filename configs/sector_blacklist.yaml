# 板块黑名单（冻结清单）
#
# ## 规则
#
# 板块池 = `sector_crowding_list` 全部板块 **减去** 本清单（再减去名称规则排除项）。
# 今天 933 - 488 = 445，与当前 `visible=1` 的配置一致。
#
# **本清单是冻结的**：只登记 2026-09-20 时点 `visible=0` 的 488 个板块。
# 之后新出现的概念板块**不在清单里，因此会自动入池并同步数据** ——
# 这是刻意的：新概念正是要跟踪的对象，不能因为「默认隐藏」就被漏掉。
#
# ## 为什么用显式清单而不是 `visible = 0` 判断
#
# 用 `WHERE visible = 1` 选池有两个隐患，换成显式黑名单后都消失：
# 1. 将来新增板块若默认 `visible=0`，会被静默漏掉且**不报错**；
# 2. 看不出「这个板块是被有意排除的」还是「它只是还没同步」——
#    两者的排查方向完全相反。
#
# 另外：黑名单文件读不到时，`import_crowding_pool` 会**回退**到
# `visible = 1` 并在同步 message 里写明，而不是把空集合当成
# 「不排除任何板块」（那会让池子无声地从 445 涨回 933）。
#
# ## 关键构成（实测）
#
#   `865xxx`  250 个 —— **整套已淘汰的同花顺概念体系**
#   `871xxx`   37 个 —— GICS 式港股/美股行业分类
#   `873xxx`    2 个
#   `875xxx`   95 个
#   `885xxx`   86 个
#   `886xxx`   18 个
#
# ⚠️ `865xxx` 与 `875xxx`/`885xxx` 存在**同名不同码**的换代关系
# （如 `风电`、`苹果概念`）。黑名单只挡同步，不做名称去重 ——
# 池内仍有同名的不同代码板块存在。
#
# ## 怎么改
#
# 恢复跟踪某个板块：把它的代码从下面删掉，再跑一次 `board_crowding` 同步。
# 新增排除项：把代码加进来。
# **不要**手工改 `sector_crowding_list.visible` —— 那只影响拥挤度界面，
# 本清单才是主线挖掘的判据。
#
