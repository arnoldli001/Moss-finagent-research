# 全年**只留中/强信号**（屏蔽 🟢 weak 观察档；medium 保留）
#
# 用户对这两个板块的指示是「**只留中强信号**」，按档位名取字面读法（中 + 强）。
# 实测差异：猪肉 strong_only 留 17 条 / medium_up 留 26 条；中船系 18 / 34。
# 若其实只想要 strong，把这两条挪到 `strong_only`（不带 `windows` 时全天生效）。
medium_up:
  - code: "885573.TI"
    name: "猪肉"
    reason: >-
      误报 39/52（75%）但**深亏率仅 6%** —— 大周期板块、自身趋势弱
      （指数区间 −13.9%、最大回撤 −34.8%）、多小波段，
      问题是「不涨」不是「亏钱」，故只挡弱信号、不整块关闭
    evidence: >-
      分档实测（冻结快照）：strong 17 条（误报率 76%、均值20 +1.80%、
      亏损率 29%、深亏率 0%）；medium 9 条（67%、−0.25%、56%、11%）；
      weak 26 条（77%、**−3.13%**、64%、8%）。
      → weak 是三个档里最差的一档（均值 −3.13%、亏损率 64%），挡掉它正对；
      medium 虽为负但样本仅 9 条，保留待观察。
    decided: "2026-09-22"
  - code: "885860.TI"
    name: "中船系"
    reason: >-
      误报 36/57（63%）但**深亏率仅 2%**；指数区间 +42.5% ——
      是**上行趋势里的择时问题**，不是板块本身弱，故保留中强档
    evidence: >-
      分档实测：strong 18 条（误报率 78%、均值20 −0.89%、亏损率 65%、
      深亏率 0%）；medium 16 条（69%、+1.68%、47%、0%）；
      weak 23 条（**48%**、+0.48%、48%、5%）。
      ⚠️ **本板块的档位与质量不是单调关系**：strong 的 20 日均值（−0.89%）
      反而比 weak（+0.48%）差，且 weak 的误报率最低（48%）。
      所以「只留中强」在这个板块上会删掉 23 条里 12 条命中 ——
      按用户指示执行，但把这一点记在这里，便于下一轮复核。
    decided: "2026-09-22"

# 季节性：只在窗口内发告警（窗口外**一律不发**）
#
# 旅游概念**用用户给的月份**（用户对它是直接给了月份列表，
# 没有要求回溯推导），`months` 便捷写法会展开成整月窗口，
# `lead_days` 因此作用在**每个月的月初**上。
#
# ⚠️ 两条必须知道的事：
#  ① 数据推导出来的窗口与这个列表**冲突很大**：`derive_speculation_windows.py`
#     给出的是 **09-01 ~ 12-16**（在 2023/2024/2026 三个年份出现过）；
#     若改用数据窗口，16 条告警会被删掉 **15** 条（含 6 条 strong），
#     而当前按月只删 1 条。两种口径都**零新增漏报**。
#  ② 用户列表里的 **1 月是数据里最差的一个月**（6 次告警均值 −14.73%、
#     无行情率 100%）；数据窗口覆盖的 9–12 月则包含了用户列的 8、9 月。
# 要切到数据窗口，把下面两行换成：
#     windows: [{start: "09-01", end: "12-16"}]
seasonal:
  - code: "885497.TI"
    name: "旅游概念"
    months: [2, 3, 4, 8, 9]
    reason: "季节性炒作题材（春节、清明五一、暑期、国庆前），与景气度无关"
    evidence: >-
      用户 2026-09-22 定稿：**关掉 1 月、把 2 月列进来**。
      这与数据一致 —— 1 月是本样本**最差的一个月**
      （6 次告警均值 −14.73%、无行情率 100%），
      而 2 月是**最好的**（1 次 +23.27%、无行情率 0%）。
      数据侧的窗口对照：启动段 9 次，09-01~12-16 在 3 个年份出现过
      （2023、2024、2026），03-12~04-02 只在 2024 出现过；
      置换检验 p=0.468（不显著），所以月份表以用户口径为准。
    decided: "2026-09-22"

# 窗口之外只放行 strong 强信号（"降级"而不是"关闭"）
strong_only:
  - code: "885914.TI"
    name: "煤炭概念"
    windows:
      # ① 春节前后的避险买盘（用户 2026-09-22：1 月和 2 月也要放开，
      #    「春节前资金避险求稳会买入煤炭板块，可能会有行情」）
      # ② 用户实盘观察到的 2026 年主线窗口之一：**2026-01-05 ~ 2026-03-12**
      #    与数据推导的 03-09~03-26 合并 → 01-05 ~ 03-26
      - {start: "01-05", end: "03-26"}
      # ③ 用户实盘观察到的另一个主线窗口：**2026-07-01 ~ 2026-08-31**
      #    （数据样本里 7/8 月没有启动段，所以此前被漏掉 —— 用户补上）
      - {start: "07-01", end: "08-31"}
      # ④ 数据推导：09-30~11-17，在 2024、2025 两个年份出现过
      - {start: "09-30", end: "11-17"}
    reason: "用户指出煤炭是季节性炒作板块；旺季之外只保留最强信号，减少噪声"
    evidence: >-
      窗口 = **用户给的两段实盘窗口**（2026-01-05~03-12、2026-07-01~08-31）
      ∪ **数据推导的窗口**（03-09~03-26：2024、2026 两年；
      09-30~11-17：2024、2025 两年）。
      数据侧：20/30 日涨幅 >15% 的启动段共 7 次，置换检验
      **p=0.012（显著）**，四个板块里唯一显著的。
