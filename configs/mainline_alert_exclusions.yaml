# 主线告警的**范围限制**（哪些板块不发、哪些只在特定月份发、哪些只留高档位）
#
# ## 与 `sector_blacklist.yaml` 的区别（不要混用）
#
#   `sector_blacklist.yaml`  → **池级**排除：板块不进拥挤度池、不同步数据。
#                              太粗，等于把这个板块从系统里删掉。
#   本文件                   → **告警级**排除：板块照常打分、照常进候选池、
#                              照常出现在拥挤度看板，只是不再产生主线告警。
#
# 用户的取舍是后者：留着数据继续观察，但别让它占告警的位置。
#
# ## 四种限制（判定顺序：excluded > seasonal > strong_only > medium_up）
#
#   excluded     完全不发告警
#   seasonal     只在列出的月份发，其余月份**一律不发**
#   strong_only  只在列出的月份正常发，其余月份**只放行 strong 强信号**
#                （"降级"而不是"关闭" —— 用在季节性证据不足、
#                  或旺季外仍可能有真行情的板块）
#   medium_up    **全年**只放行 strong + medium，屏蔽 weak 观察档
#                （用在"板块要保留、只是弱信号不值得推送"的场合）
#
# ## ⚠️ 池级剔除的板块**不在这里**登记（2026-09-22 第四批 105 个）
#
# 用户在第四批给的是「**不计入主线挖掘监控范围**，也不计入板块拥挤度检测
# 范围，不上报」—— 那是**池级**要求，落在 `configs/sector_blacklist.yaml`。
# 三个机制（不进 `ml_board` / 停止拥挤度日更 / 不算拥挤度指标）共用那**一个**
# 开关，所以本文件**故意不抄**那 105 条：同一件事写两处迟早会漂移，
# 而漂移的方向恰好是"以为关了其实没关"。
#
# 反过来说：**本文件里的板块仍在池内、仍在打分**，只是不发告警。
# 要彻底剔除，改的是黑名单而不是这里。
#
# ## ⚠️ 本文件的 `excluded` 目前**已全部被池级剔除接管**（2026-09-22 晚）
#
# 下面 14 个 `excluded` 板块（物联网 / 特钢概念 / 数字经济 / 互联网保险 /
# 超级品牌 / 钒电池 / 可燃冰 / 土地流转 / 光伏概念 / BC电池 / 动物疫苗 /
# 工业大麻 / 网络游戏 / 国产航母）在第四~七批里**陆续又做了池级剔除**，
# 所以它们现在**根本不在池内**，这里的条目已经是 no-op。
#
# **为什么保留而不删**：这是"纵深防御"—— 若将来有人把某个板块从黑名单里
# 恢复（`sector_blacklist.yaml` 删一行 + 重跑池同步），**告警不会跟着
# 悄悄回来**，还得先删掉这里的条目。反过来，删掉这里就等于把
# "当初为什么关它"的判据一起删了（批次台账里只有一句概括）。
# 每条 still 带着 reason/evidence/decided，可追溯。
#
# ⚠️ `strong_only` 与 `medium_up` 差 9~16 条告警，不要混用：
#   档位是三级 —— 🔴 strong 强 / 🟡 medium 中 / 🟢 weak 弱；
#   `strong_only` 把 medium **也**挡掉，`medium_up` 只挡 weak。
#
# ## ⚠️ 两个必须分清的概念（用户 2026-09-22 特别指出）
#
#   1. 本文件说的"季节性"是**季节性炒作** —— 题材在某几个月被资金反复炒作、
#      走出主线行情。它的证据是「≥15% 涨幅的**启动段**在月份上的聚集」
#      （见 `scripts/seasonality_report.py`），**与基本面无关**。
#   2. **景气度**是六维里的基本面维度，是**另一件事**。煤炭的景气度均值只有
#      16.7（全市场分位 17%），那是它在**候选池准入**上被压制的原因
#      （见 §16.47 / §16.51 的 V3），不要和"季节性炒作"混为一谈。
#
# ## ⚠️ 窗口 = **月-日区间**，冗余加在**起点**上（用户 2026-09-22 两次澄清后定稿）
#
# 用户原话：「窗口日期往前两周，比如历史上高度炒作时间是 **2.6-4.15**，
#   那窗口就是 2.6 − 14 个自然日，也就是 **1.23 就要放开**告警限制。」
#
# 所以：
#   * 窗口是 `start`/`end` 两个**月-日**（如 `"02-06"`），不是"哪些月份"；
#   * 允许告警区间 = **`[start − lead_days, end]`**；
#   * 上面的例子对应：`{start: "02-06", end: "04-15"}` + `lead_days: 14`
#     → 从 **01-23** 起就放行。
#
# 第一版把它做成"允许月份的月初往前推 14 天"，那是月份粒度的近似：
# 既会把 2 月 1–5 日多放进来，又在"窗口止于月中"时对不上。
#
# 窗口本身来自 `scripts/derive_speculation_windows.py`：把历史上
# 「滚动 20/30 日涨幅 > 15%」的启动段投影到一年内、间隔 ≤20 天合并。
#
# ## ⚠️ 多行文本一律用 `>-` 折叠块（2026-09-22 修）
#
# 本文件原来把多行说明写成 `key: ("第一段"` + 换行 + `"第二段")`。
# 那不是"拼接" —— YAML 的**纯量**会跨行折叠，于是引号和括号都变成
# **正文字符**，`reason` 读出来长这样：
#     ("误报 44 条…" "命中仅 12 条…")
# 它能跑，但会原样出现在 `reasons` 与日志里。现在统一改成 `>-`。
version: 1

# 左侧冗余的自然日数（14 ≈ 两周；用自然日是因为配置层拿不到交易日历，
# 且误差方向偏宽松 —— 宁可多放行，不少放行）
lead_days: 14

