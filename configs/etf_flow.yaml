# ETF 份额监控 · 配置
#
# 定位：监控核心宽基 ETF 的份额申赎，识别"国家队"与大型基金的**逆周期操作**
# 痕迹，为阶段顶底判断提供辅助信号。
#
# 两个关键事实决定了这个模块的用法（不要绕过）：
#
# 1. **份额数据是次日 8:30 左右更新的**（交易所口径）。所以盘后拉到的其实是
#    上一交易日的数据，信号本质是 T+1 确认 —— 适合阶段顶底判断，
#    **不适合日内做 T**。
# 2. **宽基 ETF 与行业 ETF 的信噪比完全不同**：
#    - 宽基份额变化主要反映国家队/大型基金的逆周期操作（逢跌买、逢涨卖），
#      因此"低位 + 大额申购"是有意义的底部信号；
#    - 行业 ETF 的份额变化容易被散户追涨杀跌主导，资金大量流入后
#      **短期反转效应显著** —— 所以行业 ETF 只出"反转警示"，不出机会信号。
#    把两者用同一套规则处理是最常见的误用。

version: 1
updated_at: "2026-09-20"

# ================================================================
# 观测清单
# ================================================================
# `group` 相同的 ETF 视为同系列，用于"多产品共振"验证（≥N 只同向才算共振）。
# `index` 是该组对应的宽基指数（算分位数用）。
watchlist:
  - group: hs300
    label: 沪深300系列
    index: "000300.SH"
    index_name: 沪深300
    level: core            # core=核心锚点（出机会/风险信号）
    etfs:
      - { code: "510300.SH", name: "华泰柏瑞沪深300ETF" }
      - { code: "510310.SH", name: "易方达沪深300ETF" }
      - { code: "510330.SH", name: "华夏沪深300ETF" }
      - { code: "159919.SZ", name: "嘉实沪深300ETF" }

  - group: sse50
    label: 上证50系列
    index: "000016.SH"
    index_name: 上证50
    level: assist          # assist=重要辅助（出信号但不单独构成共振组）
    etfs:
      - { code: "510050.SH", name: "华夏上证50ETF" }

  - group: csi500
    label: 中证500系列
    index: "000905.SH"
    index_name: 中证500
    level: assist
    etfs:
      - { code: "510500.SH", name: "南方中证500ETF" }

  - group: csi1000
    label: 中证1000系列
    index: "000852.SH"
    index_name: 中证1000
    level: assist
    etfs:
      - { code: "512100.SH", name: "南方中证1000ETF" }

  # 行业主题 ETF：**只出反转警示，不出机会信号**（理由见文件头）
  - group: industry
    label: 行业主题
    index: ""
    index_name: ""
    level: industry
    etfs:
      - { code: "159516.SZ", name: "半导体设备ETF国泰" }
      - { code: "512170.SH", name: "医疗ETF华宝" }

# ================================================================
# 阈值
# ================================================================
# 全部可调：文档明确的几个数（3% / 30% / 70% / 34 日）是起点而非结论，
# 应当用 `etf_flow_backtest` 跑出来的结果反过来调。
thresholds:
  # 指数位置分位数的回看窗口（交易日）。34 ≈ 1.5 个月，兼顾灵敏度与稳定性。
  percentile_window: 34
  # 指数位置分位数只用**窗口内的最高/最低**，还是用分位排名（见 indicators）。
  # `range` = (close-min)/(max-min)，`rank` = 百分位排名。两者在震荡市差异明显，
  # 默认用 rank（对异常极值更稳健）。
  percentile_mode: rank

  # ---- 启动自检的补拉阈值 ----
  # 份额是**次日 8:30** 才发布的，所以"份额发布前跑一次全市场同步"必然给最新
  # 交易日留下一批 shares=NULL 的行；而面板以 MAX(trade_date) 为锚点只读最后一行，
  # 于是那几只的份额/变化率/分位一起变空（2026-09-22 实测：9 只监控里 7 只中招）。
  # 服务每次启动都会自检一次，缺口超过下面这个比例才联网补拉
  # （见 src/mainline/etf_share_guard.py）。
  #
  # 为什么不是 0：`ml_etf` 里混着 `158008.OF` 这类**场外基金**，份额长期不发布
  # —— 实测份额齐全的那天全表仍缺 377/2138 ≈ 18%。判据实际优先取 watchlist 里的
  # 代码（面板真正展示的那些），所以这个比例是**兜底**；真要调小到 0.05 也可以，
  # 代价是每次启动多打一轮 Tushare（约 1~2 秒）。
  share_guard_missing_ratio: 0.30

  # ---- 机会信号（底部辅助）----
  opportunity:
    max_percentile: 0.30       # 指数分位 ≤ 30%
    min_share_change_1d: 0.03  # 且份额日环比 > +3%
    min_share_change_5d: 0.05  # 增强条件：5 日累计 > +5%

  # ---- 风险信号（顶部辅助）----
  risk:
    min_percentile: 0.70       # 指数分位 ≥ 70%
    max_share_change_1d: -0.03  # 且份额日环比 < -3%
    max_share_change_5d: -0.05  # 增强条件：5 日累计 < -5%

  # ---- 行业 ETF 反转警示 ----
  industry_reversal:
    min_share_change_5d: 0.10  # 行业 ETF 份额 5 日累计 > +10%

  # ---- 多产品共振 ----
  resonance:
    min_etfs: 3                # 同系列至少 N 只同向
    # 共振只统计 `level: core` 的组（辅助组通常只有 1 只，无法共振）

  # ---- 等级判定 ----
  # 弱信号：单一 ETF 份额日环比超阈值，但指数分位不在极端区域
  weak_share_change_1d: 0.03

  # ---- 市场环境门控 ----
  # 回测把 2018-2026 的 1252 个信号按环境拆开后出现符号相反的分化：
  #   熊市  T+34 中位数 +8.31%  胜率 74.4%   ✅
  #   震荡  T+34 中位数 -1.28%  胜率 41.9%   ⚠️
  #   牛市  T+34 中位数 -2.80%  胜率 28.6%   ⚠️（反向）
  # 混在一起统计时正负相抵，整体只剩 -0.04%/49.5%，看起来像噪声。
  # 机制上说得通：宽基 ETF 大额逆势申购主要来自国家队托底，最激烈的时点
  # 就是熊市底部；牛市里的份额增长更多是散户跟风申购，不具备领先性。
  #
  # 所以机会信号**只在熊市放行**，其余环境降级为观察（不静默丢弃）。
  # 风险信号不做门控 —— "高位赎回 → 后市走弱"在各类环境方向都成立，
  # 加门控反而会漏掉顶部。
  regime:
    # 参考指数。空 = 自动取 `level: core` 的组对应指数（即沪深300）。
    # 用行业 ETF 的指数判环境会把"行业自己的行情"误当成大盘环境。
    reference_index: ""
    # 环境窗口（交易日）。120 ≈ 半年，比 34 日的分位窗口长得多：
    # 分位窗口刻画"当下位置"，环境窗口刻画"过去半年的方向"，两者互补。
    window: 120
    bull: 0.15                 # 近 120 日收益 > +15% → 牛市
    bear: -0.15                # 近 120 日收益 < -15% → 熊市，其余震荡
    # 机会信号放行的环境。改成 [bear, range] 可放宽到震荡市，
    # 但回测显示震荡市 T+34 -0.70%/胜率 46.5%，放宽前请先复核。
    opportunity_allowed: [bear]
    # 风险信号放行的环境。默认**排除熊市** —— 这一格回测方向相反
    # （熊市 T+34 +4.69%，即信号说"要走弱"结果涨了）。
    # 机制上说得通：熊市里的下跌会被国家队买回去，所以熊市里读到
    # "高位+赎回"更像一次反弹的开始，而不是顶部。
    # ⚠️ 但该格**只有 13 个样本**，是全表最薄的一格，可能是噪声。
    # 复核后若要关闭此门控，改成 [bull, range, bear] 即可。
    risk_allowed: [bull, range]

# ================================================================
# 环境调节层（regime_multiplier）
# ================================================================
# 把 ETF 信号作为**大盘风险偏好环境调节器**作用于主线评分：
#     最终主线异动评分 = 漏斗三层评分 × regime_multiplier
#
# 三条必须先理解的约束（详见 src/mainline/etf_regime.py 模块文档）：
#
# 1. **全局乘数不改变排名。** 对所有行业乘同一个数是单调变换，排序完全不变；
#    它的真实作用是改变绝对分越过 70/55 告警阈值的板块数量 ——
#    本质是"全市场告警闸门"。只有规则 3/4 是行业级的，才会改排序。
# 2. **`total` 已 clamp 到 0-100**，所以乘数作用在 clamp 之前；
#    对已截断的高分再乘 1.15 是白调。
# 3. **规则 1 默认要求熊市**（`rule1_require_bear: true`）。
#    实测：低位+份额大增这个形态在熊市 T+34 +8.78%/胜率 76.6%，
#    牛市 -1.53%/36.7%、震荡 -0.70%/46.5% —— 符号相反。
#    按需求原样（不要求熊市）实现会在牛市回调时把全场抬 15%，
#    而那正是历史上后续 34 日跑输的情形。
regime_multiplier:
  # 总开关。默认 false：先跑 etf_regime_backtest 看四条规则的实测数字，
  # 确认有效再打开 —— 未经回测的乘数会改变告警数量且无法归因。
  enabled: false
  # 规则 1 是否只在熊市生效（见上面第 3 条）
  rule1_require_bear: true
  # 规则 3/4 冲突裁决：rule4（默认，风险警示优先）/ rule3 / stack（相乘，不推荐）
  precedence: rule4

  # ---- 规则 1：大盘底部"机会共振" ----
  rule1_max_percentile: 0.30      # 沪深300 近34日分位 ≤ 30%
  rule1_min_share_5d: 0.05        # 且沪深300系列ETF份额5日累计 > +5%
  rule1_multiplier: 1.15

  # ---- 规则 2：大盘顶部"风险警示" ----
  rule2_min_percentile: 0.70      # 分位 ≥ 70%
  rule2_max_share_5d: -0.05       # 且份额5日累计 < -5%
  rule2_multiplier: 0.85

  # ---- 规则 3：风格切换（宽基流出 + 行业流入）----
  rule3_broad_max_share_5d: -0.02   # 沪深300系列份额5日 < -2%
  rule3_industry_min_share_5d: 0.02  # 行业主题ETF整体5日 > +2%
  rule3_top_n: 3                     # 流入前 N 名
  rule3_multiplier: 1.10

  # ---- 规则 4：行业 ETF 极端流入反转警示 ----
  rule4_min_percentile: 0.90      # 份额5日变化的历史分位 > 90%
  rule4_window: 250               # 分位回看窗口（交易日）
  rule4_multiplier: 0.90

# ================================================================
# 评分合成（可选：把环境乘数写进主线评分）
# ================================================================
# 与上面的 regime_multiplier.enabled 是两个开关，刻意分开：
#   enabled            = 是否**计算**乘数（面板/回测可以只看不算）
#   apply_to_scoring   = 是否**作用**到主线评分与告警阈值上
# 分开是为了能"先观察一段时间乘数，确认它和实际盘感一致，再接入评分"。
apply_to_scoring: false

# ================================================================
# 回测
# ================================================================
backtest:
  start: "20180101"
  end: ""
  # 信号触发后的观察期（交易日）—— 34 是需求给的参考值（≈1.5 个月）
  horizons: [5, 10, 20, 34]

  # ---- 样本内 / 样本外切分点 ----
  # 上面所有阈值（3% / 30% / 70% / 34 日、环境线的 ±15%）都是**看着全区间
  # 回测结果**调出来的。再把同一份全区间结果当成"验证"，就是循环论证 ——
  # 它只能证明"当初挑出来的那段历史上确实好看"，而那是挑参数的必然结果。
  # 切分之后：`in:` 那半边是当初看的那批，`out:` 那半边才是没看过的。
  #
  # 取 20230101 的理由：2018-2022 已经包含两个完整的熊市底部（2018Q4、2022Q1），
  # 足够把阈值定下来；2023 起留出三年多做验证。
  #
  # ⚠️ 实测机会信号的样本外只剩 **1 个独立时段**（2024Q1）—— 这时候
  # "结论仍然成立"和"结论无法验证"在胜率上长得一模一样，只有「独立时段」
  # 那一列能把它们区分开。样本外不成立不等于结论错，而是**还没被验证**。
  # 留空 = 不做切分（样本内/外对照表整体为空）。
  split: "20230101"

  # ---- 目标线 ----
  # 按观察期分别设线。此前是所有观察期**共用** `median_return_34` 这一把尺子，
  # 于是 T+5 那一行拿 5 日收益的中位数去比 34 日的 4.5% 门槛，永远显示
  # "未达标" —— 那个 ⚠️ 没有信息量，还会让人误以为信号在短周期上失效。
  # 短观察期的门槛刻意定得更低：窗口越短，可达的收益幅度越小。
  #
  # 这些同样是**起点而非结论**，应当用回测结果反过来调。
  # 达标判定**按信号方向**取不等式：机会/行业类看 `中位数 >= 目标`，
  # 风险类看 `中位数 <= -目标`（它预测的是下跌）。拿做多口径去判一个
  # 判断正确的看空信号，会让它在报表里永远显示失败。
  targets:
    median_return: {5: 0.010, 10: 0.015, 20: 0.025, 34: 0.045}
    win_rate: {5: 0.58, 10: 0.60, 20: 0.62, 34: 0.65}
    # 刻意**不配** `false_positive_rate`：本模块的定义是"收益 <= 0 的比例"，
    # 它恒等于 `1 - 胜率`（见 etf_flow_backtest._stats）。
    # 再给它一条门槛等于把同一个条件写两遍，而"未达标"会因此有两个可能的
    # 原因，归因时看不出是哪一条挂的。需要这个数时它在接口返回里仍有
    # （`HorizonStats.false_positive_rate`）。

# ================================================================
# 与「主线挖掘」联动
# ================================================================
# ⚠️ 权重联动幅度（+5~10 分）**必须先回测验证**再启用 ——
# 需求文档自己也在注意事项 8.6 里写了这一点。默认 `enabled: false`，
# 回测确认有效后再打开。
linkage:
  enabled: false
  # 机会信号触发时，宽基相关板块（金融/消费等权重股集中行业）加权多少分
  opportunity_boost: 5.0
  # 风险信号触发时，对已告警板块的扣分
  risk_penalty: 5.0
  # 参与加权的板块（按名称包含匹配）
  broad_boards: [银行, 证券, 保险, 白酒, 食品饮料, 家用电器, 沪深300]

# ================================================================
# 数据
# ================================================================
data:
  # `fund_share` 单次最多返回 2000 行 —— 2018 至今约 2100 个交易日，
  # 必须**分区间拉取**否则会静默截断到 2000 行（最早的数据被丢掉，
  # 而回测区间看起来"就是那么长"）。按自然年切片足够安全。
  share_chunk_years: 1
  # 指数日线（index_daily）单次上限更高，但仍按 3 年切片
  index_chunk_years: 3
