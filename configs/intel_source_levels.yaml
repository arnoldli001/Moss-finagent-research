# 情报来源分级（可信度的**来源分**）
#
# > 这个文件是**公开可复算**的：可信度公式与这张表一起构成"为什么是这个分"
# > 的完整依据。用户看到分数旁边能展开看构成（见 `IntelCredibility`）。
#
# ## 维护方法
#
# 遇到新的来源形态就加一条 `match`（子串，全部命中才算），必要时调 `base`。
# **不要**为了"让某条分高一点"去改表 —— 那会让分数失去可复算性。
#
# ## base 的取值范围与依据
#
# 分档来自 `docs/INTEL_CENTER_REDESIGN.md` §4.1（监管/权威媒体/持牌机构/
# 自媒体/股吧论坛/未证实传闻）。数值本身是**序数**，不是物理量 ——
# 重要的是档与档之间的间隔足够大，让"来源权威性"真正成为分数的上限。
#
# ## ⚠️ match 是 **OR** 语义：命中**任意一个**词即算这一档
#
# （实测踩过：第一版按 AND 写，把 13 个近义词全列在一档里，于是
#  "交易所公告" 这种再明显不过的名字都匹配不上一档，直接落到保守档。）
#
# 所以这里只放**真正能识别档次**的词，且档与档之间**不要复用同一个词** ——
# 复用会让档次判定依赖表的顺序，改一行就可能变分。
#
# 也不要放"快讯""财经"这类**通用词**：它们几乎出现在所有渠道名里，
# 放进来会让 `东方财富-全球财经` 与 `财联社电报` 拿到同一个分。

#: 缺省档：认不出来源时用哪一档
#:
#: ⚠️ **保守取 38（股吧/论坛档）而不是中性 50**。理由：认不出来源时，
#: 我们对它一无所知；给 50 会让一条来历不明的内容看起来"和券商研报
#: 差不多可信"（84 的一半）。宁可低估 —— 低估的代价是用户多看一眼，
#: 高估的代价是他信了一条假消息。
default_base: 38

levels:
  # ── 监管 / 交易所 / 公司公告：最权威，且是"可核实"的原始文件 ──
  - base: 94
    label: 官方披露
    match: [公告, 交易所, 证监会, 监管, 上交所, 深交所, 北交所, 巨潮, 披露]
  # ── 持牌机构研报 ──
  - base: 84
    label: 持牌机构研报
    match: [研报, 证券研究, 研究所, 券商, 投资策略, 行业深度, 首次覆盖]
  # ── 权威财经媒体 / 统计口径 ──
  - base: 74
    label: 权威财经媒体
    match: [财联社, 证券时报, 上海证券报, 中国证券报, 第一财经, 新华社,
            人民日报, 央视, 统计局, 央行, 财政部, 发改委]
  # ── 财经自媒体 / 星球研报（本项目知识星球内容的档位）──
  - base: 54
    label: 财经自媒体
    match: [自媒体, 公众号, 星球, 小作文, 调研纪要, 纪要, 电报, 7x24]
  # ── 股吧 / 论坛 / 截图 ──
  - base: 38
    label: 论坛/股吧
    match: [股吧, 论坛, 贴吧, 雪球, 截图]
  # ── 未证实传闻：放最后，最低分 ──
  - base: 28
    label: 未证实传闻
    match: [传闻, 据传, 网传, 小道消息, 据说, 疑似]
