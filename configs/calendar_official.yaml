# 官方宏观发布日程（**手工维护，一年一次**）
#
# ## 为什么用手工 YAML 而不是接接口
#
# 统计局每年 12 月发布次年《主要统计信息发布日程表》—— 那是一张**静态表**。
# 为它去接一个不稳定的第三方接口，收益是"省一次手工录入"，
# 代价是多一个会失效的依赖。对一年只变一次的数据，静态文件更可靠。
#
# ## 维护方法
#
# 每年 12 月（或需要时）：
#   1. 打开 国家统计局 → 统计信息发布日程表
#   2. 把下一年各月/季度的发布日期填到下面
#   3. FOMC 日程从美联储官网 的会议日历取
#
# 只填**已知日期**。日期未知的条目不要写 —— 本项目口径是"不猜"，
# 宁可这次日历里没有，也不要给一个可能错的日期（错日期会让使用者
# 在错误的日子等数据）。
#
# ## 字段
#
#   key       稳定标识（改名字不影响订阅关系）
#   name      展示名
#   date      发布日期 YYYY-MM-DD
#   previous  上一期值（可比对，**不是预测**）
#   kind      macro（国内）| fed（海外议息）
#   match     模式契约（**强烈建议填**，见下）
#
# ## match：为什么必须写清"哪个名字才是这个指标"
#
# 预期值/前值由全球财经日历按**事件名**自动补。但日历里同一个指标有
# 好几条变体，靠名字猜必然猜错 —— 实测踩过的两个坑：
#
#   · "CPI" 会被 "中国台湾9月未季调CPI**读数**" 命中（双向包含），
#     拿到 112.32。那是**指数读数**，不是同比%，与国内 CPI 不可比。
#   · "制造业PMI" 与 "非制造业PMI" 归一化后**同名**，字典后写覆盖
#     前写，拿到 49.0（非制造业），真值 49.8。
#
# 所以用 include / exclude 把"是哪个指标"写死：
#
#   include   全部子串都要在事件名里（AND）
#   exclude   任一子串命中即淘汰
#
# 匹配不上时界面显示「待公布」/「暂无一致预期值」—— **不编数字**。
#
# ⚠️ 合规：本文件只列**日程**（哪天发布），不含任何方向判断。

macro:
  # ── 近期（用于验证"预期差"匹配通路）──
  - key: industrial_profit_202608
    name: 规模以上工业企业利润
    date: "2026-09-27"
    kind: macro
    match:
      include: [规模以上工业企业利润, 年率]
      exclude: [单月, 金额]
  - key: pmi_202609
    name: 制造业PMI
    date: "2026-09-30"
    kind: macro
    match:
      include: [制造业PMI]
      exclude: [非制造业, 综合]

  # ── 2026 年 10 月 ──
  - key: cpi_202609
    name: CPI
    date: "2026-10-09"
    kind: macro
    match:
      include: [CPI, 年率]
      exclude: [台湾, 香港, 月率, 季调, 读数]
  - key: ppi_202609
    name: PPI
    date: "2026-10-09"
    kind: macro
    match:
      include: [PPI, 年率]
      exclude: [台湾, 香港, 月率, 读数]
  - key: gdp_2026q3
    name: GDP
    date: "2026-10-19"
    kind: macro
    # GDP 的变体最多（年率累计 / 年率当季 / 季率 / 总量），
    # 最容易错的是 "GDP总量"（361511 亿元）—— 那不是增速。
    match:
      include: [GDP, 年率]
      exclude: [台湾, 香港, 总量, 季率, 金额]
  - key: pmi_202610
    name: 制造业PMI
    date: "2026-10-31"
    kind: macro
    match:
      include: [制造业PMI]
      exclude: [非制造业, 综合]

fed:
  # FOMC 议息日程（美联储官网公布，一年 8 次）
  - key: fomc_202611
    name: FOMC 议息会议（决议公布）
    date: "2026-11-05"
    kind: fed
  - key: fomc_202612
    name: FOMC 议息会议（决议公布）
    date: "2026-12-17"
    kind: fed
