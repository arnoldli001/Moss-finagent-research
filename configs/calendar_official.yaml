# 官方宏观发布日程（**手工维护，一年一次**）
#
# ## 为什么用手工 YAML 而不是接接口
#
# 统计局每年 12 月发布次年《主要统计信息发布日程表》—— 那是一张**静态表**。
# 为它去接一个不稳定的第三方接口，收益是"省一次手工录入"，
# 代价是多一个会失效的依赖。对一年只变一次的数据，静态文件更可靠。
#
# ## 维护方法
#
# 每年 12 月（或需要时）：
#   1. 打开 国家统计局 → 统计信息发布日程表
#   2. 把下一年各月/季度的发布日期填到下面
#   3. FOMC 日程从美联储官网 的会议日历取
#
# 只填**已知日期**。日期未知的条目不要写 —— 本项目口径是"不猜"，
# 宁可这次日历里没有，也不要给一个可能错的日期（错日期会让使用者
# 在错误的日子等数据）。
#
# ## 字段
#
#   key       稳定标识（改名字不影响订阅关系）
#   name      展示名
#   date      发布日期 YYYY-MM-DD
#   previous  上一期值（可比对，**不是预测**）
#   kind      macro（国内）| fed（海外议息）
#
# ⚠️ 合规：本文件只列**日程**（哪天发布），不含任何方向判断。

macro:
  # ── 近期（用于验证"预期差"匹配通路）──
  # 说明：预期值/前值会由全球财经日历**按事件名自动补**，
  # 匹配不上时界面显示「待公布」或「暂无一致预期值」—— 不编数字。
  - key: industrial_profit_202608
    name: 规模以上工业企业利润
    date: "2026-09-27"
    kind: macro
  - key: pmi_202609
    name: 制造业PMI
    date: "2026-09-30"
    kind: macro

  # ── 2026 年 10 月 ──
  - key: cpi_202609
    name: CPI
    date: "2026-10-09"
    kind: macro
  - key: ppi_202609
    name: PPI
    date: "2026-10-09"
    kind: macro
  - key: gdp_2026q3
    name: GDP
    date: "2026-10-19"
    kind: macro
  - key: pmi_202610
    name: 制造业PMI
    date: "2026-10-31"
    kind: macro

fed:
