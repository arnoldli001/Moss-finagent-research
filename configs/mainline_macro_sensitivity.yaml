      ppi_yoy: -0.30
    note: 家具与包装受地产竣工和出口双重影响，纸浆木材成本顺 PPI 上行构成压力，是地产链中弹性偏弱的一环

  - code: "801150"
    name: 医药生物
    sensitivity:
      pmi: 0.00
      m1_yoy: 0.15
      m2_yoy: 0.20
      sf_yoy: 0.05
      shibor_3m: -0.25
      cpi_yoy: 0.15
      ppi_yoy: -0.10
    note: 需求刚性、与宏观周期基本脱敏；作为久期较长的成长资产，利率下行时估值受益，CPI 仅通过中药材与消费医疗价格小幅传导

  - code: "801160"
    name: 公用事业
    sensitivity:
      pmi: 0.00
      m1_yoy: -0.10
      m2_yoy: 0.00
      sf_yoy: 0.05
      shibor_3m: -0.30
      cpi_yoy: 0.05
      ppi_yoy: -0.50
    note: 电价受管制、需求刚性，PPI 上行（燃料成本）无法向终端传导，是 PPI 最明确的受损方；高股息属性使其在利率下行时相对占优

  - code: "801170"
    name: 交通运输
