# 主线挖掘 · 历史板块启动事件真值标签（Ground Truth）
#
# ## 这个文件为什么存在
#
# 事件回测的第一道关卡不是算分，而是**标签能不能对上一个确切的板块**。
# 自动关键词匹配在本地板块池上不可用，原因有三（实测，见文件末尾的"池现状"）：
#
# 1. **440 个板块里只有 386 个唯一名 —— 54 个重名。**
#    重名板块的 `sector_code` 不同，按名字匹配会随机命中其中一个。
#    所以本文件一律用 `code` 指定板块，**不用名字**。
# 2. **池里混进了非 A 股概念板块。** 代码前缀 `871xxx` 的 34 个是
#    港股/美股 GICS 式行业分类（`商业银行`/`航空航天与国防`/`客运航空公司`/
#    `半导体产品与设备`/`互动媒体与服务`…），不是 A 股概念板块。
#    关键词匹配会大量命中它们，例如"军工"会命中 `航空航天与国防` 和
#    `客运航空公司` —— 两者都与中航电测无关。
# 3. **部分真值概念在池里根本不存在**：`ChatGPT`、`Sora`、`光模块`、
#    `电解液`、`六氟`、`基建`、`大消费`、`新消费`、`工业气体`、`种业`、
#    `计算机`、`鸿蒙`、`茶`、`饮品` 全部 0 命中。
#
# ## 字段
#
#   date    真值启动日（YYYY-MM-DD）
#   label   用户给的原始标签
#   codes   映射到的板块代码（**可多个**：标签本身就是多板块组合）
#   status  ok          已确认可回测
#           proxy       池内无对应概念，用语义最近的板块代理（结论需打折）
#           needs_review 我未能从池内确认，**代码留空**，需要你指定
#   note    歧义/代理说明
#
# `status != ok` 的事件在统计胜率时**必须单独列出**，不能混进总体胜率 ——
# 拿代理板块算出来的"命中"不是模型命中了真值，而是代理恰好涨了。
#
# ## 池现状（实测快照，用于复核）
#
#   visible=1                       445 个
#   排除 同花顺/全收益/昨日 后        440 个
#   唯一名                           386 个（54 个重名）
#   代码前缀  871: 34（GICS，应剔除）  875: 124  885: 206  886: 75  873: 1

version: 1
updated_at: "2026-09-20"

# ---- 回测参数 ----
backtest:
  # 告警后观察期（交易日）
  horizons: [5, 10, 20, 60]
  # 最大涨幅观察窗口
  max_gain_window: 60
  # 命中判定：告警后 20 日涨幅 > 5%
  hit_return_20: 0.05
  # 目标提前天数（交易日）
  target_lead_days: 5
  # 命中判定允许的"迟到"容忍：告警日晚于启动日 N 个交易日内仍算命中
  late_tolerance_days: 5
  # Purged Walk-Forward 的 purge 窗口（交易日）
  purge_days: 10
  # 是否启用 ETF 环境调节器（第五章要对比开/关，所以两边都跑）
  regime_multiplier: [false, true]

