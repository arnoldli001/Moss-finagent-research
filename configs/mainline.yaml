# 主线挖掘模块配置（mainline mining）—— V2.0 去重版
#
# 口径来源：需求设计文档《主线挖掘功能模块 V2.0（去重版）》。
# 所有阈值集中在此文件，改参数**不需要动代码**；服务按 mtime 热重载（见 config.py）。
#
# ⚠️ 三个数字口径必须分清：
#   - `score` 系列是 **0-100 分**（最终预警分与子模型分），用于告警阈值；
#   - `weight` 系列是**百分比**（合成合计 100），用于加权；
#   - `ratio` 系列是 **0-1 小数**（如 candidate_ratio=0.20）。
# 混用会让"分数永远不到阈值"或"候选池变成全市场"。
#
# ================================================================
# V2.0 与 V1.0 的结构性差异（改配置前必读）
# ================================================================
#   V1.0：三层**加权相加**（六维40 / 五维35 / 龙头25）→ 资金流、股东户数、
#         成交量因子被重复加权 2-3 倍，回测胜率虚高、实盘失效。
#   V2.0：**漏斗式串联**，每层只吃上一层没覆盖的增量信息：
#
#           第一层 六维基座（全市场）──前20%──▶ 候选池
#           第二层 三维建仓痕迹（仅候选池）──前5~10──▶ 精选名单
#           第三层 龙头共振（门控加分，**不占权重**）
#
#         最终分 = 第一层 × 50% + 第二层 × 50% + 门控加分(0~20)
#
#   第二层已删除的因子（不要"补回来"）：
#     ~~主力资金强度~~ → 第一层 moneyflow 已覆盖
#     ~~筹码集中（股东户数）~~ → 第一层 chips 已覆盖
#     ~~通用均线排列 / RSI~~ → 第一层 technical 已覆盖（第二层只留形态识别）

# ================================================================
# 一、漏斗合成（前两层各 50%，第三层门控）
# ================================================================
synthesis:
  # 两层权重（百分比，合计 100）。
  #
  # ⚠️ V2.3（2026-09-21）把 50/50 改成 **100/0**，理由不是"第二层没用"，
  # 而是**名义权重 ≠ 实际影响**。候选池内实测（696 天重打分后）：
  #
  #     six_dim       日内 sd ≈  4.5   （第一层已经把池子筛到高位，池内差异小）
  #     accumulation  日内 sd ≈ 13.1   （池内差异大）
  #
  # 两层原始分直接 50/50 相加时，方差贡献是 `0.25×4.5²` 对 `0.25×13.1²`
  # —— 六维层只占 **10.7%（旧窗口）/ 8.5%（新窗口）** 的方差。
  # 也就是说"50/50"是名义的，实际排序约 **90% 由第二层主导**，
  # 而第二层在候选池内 H=20 的 IC 恰好更差（+0.017 / **−0.057**）。
  #
  # 直接模拟"每日取头部 10 个"的 20/60 日超额收益（`scripts/layer_weight_sim.py`）：
  #
  #   六维权重  旧H20    旧H60    新H20    新H60
  #     100    +0.53   +1.16   −0.05   −0.46
  #      80    +0.50   +0.77   −0.16   −0.29
  #      50    +0.17   +0.30   −0.41   −0.21   ← 改动前
  #
  # 100/0 在 3 个格子里显著更好、在"新窗口 H60"略差（−0.46 vs −0.21，
  # 但该格标准误 ±0.34，**不可区分**）。H=20 的方向在两个窗口**同号**，
  # 这是本项目的复现判据。详见 `docs/MAINLINE_MINING.md` §16.34。
  #
  # 附带好处：`base_total` 不再"池内 50/50、池外纯六维"地混用两个公式
  # （`service.py` 的非候选分支本来就取纯六维），全池口径终于一致。
  #
  # 🩸 **V2.4（2026-09-21）改成 80/20，因为 100/0 的"优点"其实是 bug。**
  # `service.py` 合成两层时**没有检查层的 `available`**，而层没数据时
  # `weighted_score` 返回 `score = 0`（"没有数据"的表示就是 0 分）。
  # 于是第二层没数据的板块 `base_total` 被**腰斩**（旧窗口超过一成的候选
  # 板块、单日实测 47/59），而它们随后反而跑赢 —— 覆盖率 IC 是
  # −0.0455/−0.0805。100/0 把第二层权重设成 0，等于**绕过**这个 bug。
  #
  # 修好（层合成只在有数据的层之间平均，见 `service.py`）之后，六格
  # （3 窗口 × 2 持有期）汇总变成：100/0 在**最差超额（−0.60，全场最差）**
  # 与**平均 IC（+0.0343，全场最低）**上都垫底；80/20 的最差格最好
  # （最差 IC −0.0193、最差超额 −0.29）。详见 §16.39。
  layer_weights:
    six_dim: 80.0
    accumulation: 20.0

  # 第三层龙头共振的门控加分区间（0-100 分制上的加分；不参与权重分配）
  gate_bonus_min: 15.0
  gate_bonus_max: 20.0

  # 动态权重：每 N 个交易日按过去 M 日滚动 IC/ICIR 重算
  rebalance_days: 20
  ic_window_days: 120

  # ICIR 加权下限：某个维度 ICIR 为负或近 0 时不参与加权
  # （否则负 ICIR 会把它自己的权重算成负数，合成分失去意义）
  min_icir: 0.02

  # 单一维度权重上限（百分比）：防止某个维度 ICIR 偶然极高时独占权重
  max_single_weight: 70.0

  # 回退机制：动态权重的验证期 IC 低于等权时，自动回退等权
  fallback_to_equal: true

# ================================================================
# 二、漏斗闸门（每层放多少板块进下一层）
# ================================================================
funnel:
  candidate_ratio: 0.20   # 第一层 → 候选池（前 20%）
  candidate_min: 8        # 板块很少时也要有池子
  candidate_max: 80       # 上限：防止板块目录异常膨胀把第二层拖死
  select_top: 10          # 第二层 → 精选名单（前 5~10 个）
  select_min: 5

# ================================================================
# 三、第一层：开源六维基座（子权重合计 100）
# ================================================================
six_dim:
  weights:
    trading: 20.0        # 交易行为：日内动量 + 隔夜反转 —— **反向**（见 reverse_dims）
    prosperity: 30.0     # 景气度：盈余动量（ROE 变化）—— IC 最强且随持有期增强
    moneyflow: 20.0      # 资金流：主力抢筹 + 小单派发
    chips: 10.0          # 筹码结构：获利盘占比 + 股东户数（IC 弱负，降权）
    macro: 5.0           # 宏观驱动：PMI / 社融 / 利率行业映射（IC 弱负，降权）
    technical: 15.0      # 技术指标：均线排列 + RSI + 量能 —— **反向**

  # 需要**反向**参与层合成的维度（层里用 `100 - score`）。
  #
  # 依据：实测 IC 在 5/10/20/60 四个持有期上**单调为负**
  #   trading    -0.041 / -0.056 / -0.077 / -0.109
  #   technical  -0.036 / -0.064 / -0.082 / -0.079
  # 即"量能与技术形态越强、后续越差" —— A 股概念板块 20~60 日尺度上均值回归。
  #
  # 离线实测（在已落库维度分上合成，无需重打分）：
  #   现行六维        H=20 IC -0.0375   IC>0 47%
  #   砍动量            H=20 IC +0.0077   IC>0 52%
  #   反转动量          H=20 IC +0.0694   IC>0 57%
  #                     H=60 IC +0.0821   IC>0 68%
  # 反转比砍掉好约 9 倍（保留了信号的信息量）。
  #
  # ⚠️ 这是**同一样本内的权重搜索**，上实盘前必须样本外确认。
  reverse_dims:
    - trading
    - technical

  # 景气度**低于**这个分（压制前的水平值分）时，改用「增速变化率」口径。
  #
  # 背景：景气度用的是同比增速 `g`（一阶导），而概念池里全是成长题材，
  # 于是煤炭、煤化工、物业这类成熟价值股，以及硅能源、短剧游戏、空间计算、
  # DeepSeek、华为盘古、谷子经济这些**新题材**（成员公司小、增速为负）
  # 被同一个维度压住 —— 实测景气度全市场分位 < 30 的 **29 个板块**，
  # 进池比例中位只有 2%（分位 > 70 的 41 个板块是 53%）。
  #
  # 改法：这些板块改用 `Δg = g(t) − g(t−60)` 的横截面分位（二阶导，
  # 对应"增速的拐点"）。实测（候选层面、只依赖六维排名）：
  #
  #   范围            煤炭进池  低景气组进池  留出 FP/TP  留出召回
  #   不换               3%        2%         6.30        8%
  #   29 个（本设定）    30%       18%         6.20 ✅     9% ✅
  #   全部 321 个        28%       17%         8.44 ❌     7%
  #
  # ⚠️ **不能全局换**：候选池每天固定 64 个名额，作用范围越大、被挤掉的
  # 真信号越多，全局换在留出窗口明显变差。详见
  # `docs/MAINLINE_COAL_SPECIAL_CASE.md`。
  #
  # 设为 0 或负数 = 关闭（全部走水平值）。
  prosperity_delta_below: 30.0
  # 变化率回看的交易日数（60 ≈ 一个季度，与财报更新节奏对齐）
  prosperity_delta_window: 60

  # 各维度内部参数的滚动窗口（交易日）
  windows:
    momentum: 20         # 日内动量回看
    overnight: 20        # 隔夜跳空回看
    prosperity: 250      # 景气度横向排名回看
    moneyflow: 5         # 资金流净流入回看
    chips: 250           # 筹码结构回看
    technical: 60        # 技术指标回看

# 第一层筹码结构维度（V2.0 起只在这里用一次，第二层不再重复）
chip:
  profit_ratio_window: 250     # 获利盘占比回看窗口
  holder_drop_threshold: -0.10 # 股东户数环比下降超 10% 视为显著
  # 股东户数是季报频率、滞后 1-3 个月；超过该天数即打折
  staleness_days: 90
  staleness_penalty: 0.5

# 第一层宏观驱动维度
macro:
  window_months: 36
  # 行业对宏观因子的敏感度映射表（configs/ 下，缺失则如实记 gap）
  sensitivity_file: mainline_macro_sensitivity.yaml
  # 宏观状态对全部板块是"共同项"，占比过高会让所有板块分数趋同
  common_weight: 0.5

# ================================================================
# 四、第二层：建仓痕迹（子权重合计 100，仅候选池内计算）
# ================================================================
# V2.0 原本是三维（杠杆35/北向35/量价30）。加入 etf 后一度改成
# 30/30/25/15 —— ETF 份额与成交额衡量的是**场外资金申购**，与原有三维
# （个股杠杆 / 个股外资 / 板块指数形态）来源互不重叠，仍满足 V2.0
# "每层只处理上一层未覆盖的增量信息"的去重原则。
#
# ⚠️ V2.1 起 ETF **退回 0 权重**，改走加分（见下面 `etf.bonus_*`）。
# 理由（实测）：分析池 324 个概念板块里能映射到 ETF 的只有 22~35 个
# （7%~11%）。一个在 90% 样本上不存在的因子占加权平均的 15%，实际效果
# 不是"补充信息"而是**从其余三维身上偷权重** —— 有 ETF 的板块被顶掉
# 15% 的话语权，没有的板块权重被重新归一化，于是第二层的分在不同板块
# 之间**不可比**。改成加分后，没有 ETF 的板块是中性（+0），有异动的才加，
# 这才是"增量信息"该有的样子。
accumulation:
  weights:
    leverage: 25.0       # 杠杆资金（融资余额）—— 实测 IC −0.021，唯一为负的维度，降权
    northbound: 50.0     # 北向资金 —— 实测 IC 随持有期增强（H=60 +0.068、IC>0 69%），加权
    volume_price: 25.0   # 量价形态 —— 与 northbound 组合的非重叠 t=3.27（全表唯一 >2）
    etf: 0.0             # ETF 资金异动：**不占权重**，改由 etf.bonus_* 加分

  # 维度1 杠杆资金
  leverage:
    change_window: 5            # 融资余额 5 日变化率
    top_rank: 5                 # 进入全市场前 N 名
    consecutive_days: 5         # 连续 N 日
    low_position_window: 60     # 板块指数近 N 日低位区域
    low_position_quantile: 0.35 # 位于区间下 35% 视为低位

  # 维度2 北向资金
  #
  # ⚠️ 数据现实（2026-09 实测）：交易所自 2024-08 起停止披露北向**日度个股净买入**，
  #    只剩沪深股通汇总（无个股归属）。个股**持股**走 hk_hold(trade_date=...)：
  #    2022-01 ~ 2024-08-16 是日频，之后只在**季末**披露快照。
  #    因此本维度走「持股数量变化折算净买入」（Δ持股 × 均价），
  #    2024-08 之后自动退化为季度变化并在 gaps 里标注。
  #    ⚠️ 非季末日的 hk_hold 会返回**港股**，取数层已按 .SH/.SZ/.BJ 过滤。
  northbound:
    consecutive_days: 3           # 连续净买入天数门槛
    min_ratio_to_float_mv: 0.001  # 累计金额占板块流通市值比例门槛（0.1%）
    price_window: 5               # 持股变化折算金额用的价格窗口

  # 维度3 量价形态（**只做形态识别，不用原始成交量因子**）
  volume_price:
    new_low_window: 60          # 创近 N 日新低（地量判定的前提）
    shrink_ratio: 0.5           # 缩量至均量的比例
    shrink_window: 60           # 均量回看窗口
    expand_ratio: 1.2           # 放量至均量的比例
    expand_min_days: 3
    expand_max_days: 5
    max_rise_pct: 5.0           # 「温和上行」期间累计涨幅上限（%）

# ================================================================
# 四之二、ETF 资金异动（**加分项 + 提名触发器**，不占第二层权重）
# ================================================================
#
# 为什么加这一维：2026-06~07「农业ETF易方达」562900 多次出现历史级成交额、
# 场外资金持续申购，但主线模块对农业毫无反应 —— 三个层里没有任何一项在看 ETF。
#   第一层 技术/量能   看板块指数自身的成交（成员股加总）
#   第二层 杠杆/北向   看个股的融资余额与外资持股
#   ETF 份额变化是**场外资金申购**，来源完全不同，是真正的增量信息；
#   而且它在板块指数还没动的时候就能看到"钱在往里进"，正是"启动前"。
#
# 触发口径：**两级，任一成立即触发**（聚合口径 + 单只口径取并集）
#   一级  历史级放量（成交额 ≥ 近 60 日均值 2 倍 且 处于自身 90 分位以上）
#   二级  一级 + 份额净申购（Σ份额_t / Σ份额_{t-1} - 1 > 0）
#
# ⚠️ 为什么一级不要求净申购：**放量先于净申购**。562900 实测
#   2026-06-29 成交额 2.22 倍 / 份额 -3.0%，2026-07-01 2.03 倍 / -3.1%
#   （折价套利期间份额反而减少），只有 07-06 才是 +6.31%。
#   旧口径要求"放量 + 净申购同时成立"，等于把启动第一周整体丢掉。
#
# 聚合口径（板块内全部 ETF 合计）与单只口径都要：一个主题常有十几只 ETF，
# 规模最大的那只份额不动就会把板块聚合摊薄到 0 —— 实测农业聚合后 +0.0%，
# 而 562900 自己 +6.31%。没有 ETF 映射的板块（324 个里约 290 个）加分为 0，
# 是**中性**的，不会影响它们与其它板块的可比性。
etf:
  enabled: true
  # ETF ↔ 板块关键字映射表（configs/ 下）
  mapping_file: mainline_etf_mapping.yaml
  window: 60                  # 成交额放量的回看窗口（交易日）
  # ⚠️ 1.5 是按农业事件定的，不是标定结果。
  # 全历史扫描：1.5 → 板块-日 4333（相对 1.6 只多 4%）、农业真值召回 4/4；
  #             1.6 → 4171、3/4；2.0（最原值）→ 3296、2/4。
  # 1.5 是拐点：再往下（1.4）信号量增 7% 但召回不再改善。
  # 同时否掉了「分位 ≥95% 即算」的旁路：它更少（0.73x）也更差（3/4）。
  breakout_amount_ratio: 1.5  # 放量倍数门槛
  breakout_percentile: 0.90   # 当日成交额在自身近 N 日分布中的分位门槛（保持不动）
  history_days: 400           # 历史回填长度
  nominate_on_breakout: true  # ETF 异动可作为提名触发（绕过第一层初筛的第二条入口）

  # ---------- 加分（不占权重，加在最终分上）----------
  #
  # ⚠️ 这四个数是**可调参数，不是标定结果**。它们直接决定召回率与准确率的
  # 取舍，应当由回测 / 事件复盘来定，而不是实现时拍一个"看起来合理"的数。
  # 调这里就能改，不需要动代码。
  #
  # 标定方法（待做）：对已知真值事件（configs/mainline_ground_truth.yaml）
  # 与全量告警做网格搜索，画 召回率-准确率 曲线，取拐点。
  bonus_enabled: true
  bonus_level1: 6.0           # 一级（历史级放量，不要求净申购）
  bonus_level2: 12.0          # 二级（放量 + 份额净申购），**取代**一级
  bonus_resonance: 3.0        # 多只 ETF 同时二级异动的额外加分
  bonus_cap: 20.0             # 封顶，与第三层门控加分 0~20 同量级

# ================================================================
# 四之三、板块成分股池（**已被下面的 relevance 取代，默认关闭**）
# ================================================================
# 老口径：成交额 top30% 作为"市场验证过的相关度"。它有两个缺陷：
#   1. 裁掉了"正在被吸筹但还没成交"的票 —— 而"启动前"恰恰是本模块要抓的场景，
#      地量建仓期的票成交额必然低，正是最该保留的；
#   2. 比例裁剪与板块大小强相关：236 只成分股的 PCB 概念砍掉 70% 还剩 70 只，
#      20 只小概念砍到只剩 6 只，两者口径不可比。
#
# 保留它是因为成交额口径只用当日及之前的数据，**回测时没有前视偏差**，
# 可用来对比两种口径的效果。⚠️ 两套**不要同时开**：会叠加裁剪，
# 得到不可解释的"为什么只剩这么几只票"。
pool:
  enabled: false      # ← 现行口径见下面的 relevance 段
  mode: turnover      # turnover=成交额分位 / mainbz=主营业务匹配 / both=并集
  top_pct: 0.30       # 只保留相关度最高的前 30%
  min_members: 8      # 成分股少于该值时不裁剪（小板块再裁就没剩几只）
  keep_min: 5         # 裁剪后至少保留几只
  # 流通市值下限（元）。**默认 0 = 不启用**：小市值票常是题材的早期龙头，
  # 一刀切会把它们筛掉。需要"只做大票"时再设成 5.0e9（50 亿）。
  min_circ_mv: 0.0
  always_keep_top: 3  # 成交额前 N 名强制保留（龙头不该被裁掉）
  exclude_st: true    # 排除 ST / 退市（它们的资金动作与板块主线无关）
  rule_file: mainline_pools.yaml

# ================================================================
# 四之四、成分股**提纯**（现行口径）
# ================================================================
# 一只股票要留在某概念板块里，该概念必须落在**这只股票自身**「最相关的前 3
# 题材」之内。「相关」由两个信号共同决定 —— 缺一不可：
#
#   走势相关性 60%   市场把这只股当什么在炒（corr_weight）
#   主营业务   40%   公司实际做什么（LLM 逐股判定，见 llm_tier）
#
# 为什么两个都要（实测三花智控 002050，主营制冷部件，与其 50 个概念板块）：
#   华为汽车     +0.689   ← 市场定价的主线
#   人形机器人   +0.680   ← 机器人业务营收占比还很低，但走势由它驱动
#   近期解禁     +0.567   ← 纯属巧合（已被假板块规则排除）
#   ...
#   家电零部件   +0.515   ← 真实主营，只排第 14
# 只看主营会把"人形机器人"砍掉（与意图完全相反）；只看相关性会把"近期解禁"
# 留下。所以：相关性定排序与权重，主营判断负责剔除巧合。
#
# 另一条硬门槛：**总市值** < 30 亿的成分股删除。
#
# 算法与全部实测记录见 src/mainline/relevance.py。
# 批量计算入口（离线跑一次，之后增量）：
#     python scripts/mainline_relevance.py --stage all
relevance:
  enabled: true
  # 只滤概念板块。sw_l1（申万一级行业，31 个）是**行业分类**不是题材，
  # 套用"前 3 题材"会把 300 只成分股的行业砍到几十只，纯粹是数据损失。
  kinds: [concept]
  top_themes: 3       # 相关性前 N 名之内才保留
  # 总市值下限（元）。注意是**总市值**（quant_daily_basic.total_mv）不是流通市值。
  min_total_mv: 3.0e9
  # 排除 ST / *ST / 退市股：它们的涨跌幅限制是 ±5%，资金动作与板块主线无关。
  # 名称按**运行日**从行情仓取 —— ST 状态会随时间变化（"ST 舍得"后来摘帽），
  # 不能离线写死。
  exclude_st: true
  corr_weight: 0.60   # 走势相关性权重（其余归主营业务相关性）
  corr_window: 240    # 走势相关性回看交易日
  max_candidates: 20  # 按相关性取前 N 个题材交给 LLM（省 token、避免长尾干扰）
  # LLM 路由层。实测单只延迟（真实打分 prompt）：
  #   decision  (deepseek-v4-pro) 40.1s   质量最好
  #   reasoning (deepseek-flash)  15.9s   质量接近，全量约 83 分钟
  #   medium    (deepseek-flash)  70.8s   同模型但未见更快
  #   light     (本地 1.5B)        2.2s   ⚠️ **不可用**
  # light 不可用的原因：每个题材都给 85 分、理由是从题面复制的模板，且随机
  # 只答 1~6 个（候选 20 个），完全失去区分度。别为了省钱换它。
  llm_tier: reasoning
  concurrency: 16     # 实测 16 路稳定推进（约 56 只/分钟）；再高容易撞限流

  # ---- 业务判定对「相关性直通」的否决权（Task 1）----
  #
  # ⚠️ **默认关闭，且这个默认值不是随手写的**：
  #   `false` = `corr >= corr_direct(0.55)` 直接归属，业务分不参与 ← **现行口径**
  #   `true`  = LLM 判过该题材且 < 70 分 → 拦下，相关性不得覆盖
  #
  # 为什么关着：这条规则**实测跑过一次完整全流程**（提纯 + 903 天全量重打分），
  # 聚合指标变好（20 日均值 +2.56%→+2.72%、大跌占比 7.4%→6.9%、真值漏报 4→3），
  # 但**启动集 FP/TP 在留出窗口变差（1.27→1.38）**；而用户说过「重点是误报影响大」，
  # 工具里事先写死的判据是「③④变差就该回退」→ 按规则回退。
  # 详见 docs/MAINLINE_MINING.md §16.74（执行记录）与 §16.75（残留归因）。
  #
  # 现状：`ml_member_pure` 里 source='corr' 且业务分 <70 的成员有约 5322 条
  # （占已纳入的 22%），**含 002140 东华科技 @ 885652 钛白粉概念**。
  #
  # 要打开它，必须连着做三件事（否则会停在"新池子 + 旧分数"的混合态）：
  #   1) python scripts/purify_members.py --all --replace --no-llm
  #   2) python scripts/rescore_mainline.py --force     （历史分数全变）
  #   3) python scripts/refresh_crowding_metric.py      （成员变了 flow_ratio 变）
  #
  # 只想临时对比、不想改配置时，用命令行覆盖：
  #   python scripts/purify_members.py --all --replace --no-llm --business-veto
  business_veto: false

# ================================================================
# 五、第三层：龙头共振确认（门控加分，不占权重）
# ================================================================
leader:
  top_n: 3                     # 资金/涨幅/成交三维各自取前 N
  capital_window: 5            # 资金维度回看
  momentum_window: 10          # 涨幅维度回看
  volume_window: 5             # 成交维度回看
  # 龙头资金集中度 = 龙头股 N 日主力净流入 / 板块 N 日主力净流入
  resonance_ratio: 0.30        # >30% 触发共振
  bonus_min: 15.0              # 门控加分的下界
  bonus_max: 20.0              # 门控加分的上界
  # 龙虎榜席位确认也算共振（辅助确认）
  seat_counts_as_resonance: true
  # 龙虎榜席位追踪（**第三层唯一真正独立的新数据**）
  seat:
    min_stocks: 3              # 板块内至少 N 只个股出现同一席位大额净买入
    min_net_buy: 5000000.0     # 单席位单股大额门槛（元）
    institution_weight: 1.0    # 机构专用席位权重
    branch_weight: 0.6         # 游资营业部权重
    lookback_days: 5

# ================================================================
# 六、告警触发规则
# ================================================================
alert:
  # ⚠️ V2.3（2026-09-21）：`layer_weights` 改成 100/0 后**必须同步重标定**
  # 这两个绝对阈值。原因：`total = clamp(base_total + 加分)`，而
  # `base_total` 从「0.5×六维 + 0.5×第二层」变成「纯六维」。候选池内：
  #
  #     total(旧)  mean 49.3 / sd 13.9      total(新)  mean 66.5 / sd  7.8  ← 旧窗口
  #     total(旧)  mean 55.9 / sd 12.0      total(新)  mean 68.2 / sd  9.0  ← 新窗口
  #
  # 均值整体**抬高约 17 分**、方差**减半**。若沿用 55/70：
  # 新窗口会出现 **100% 的候选板块**都满足 `total ≥ 55` —— 中信号等于全选。
  #
  # 🩸 第一版标定（68 / 78）是**错的**，实测告警量变成 **1.84x**。
  # 错在拿"候选池里超过阈值的**整体比例**"去匹配 —— 而真实判据是**条件分布**：
  #     STRONG = 候选 & 达标维度 ≥ 2 & total ≥ S
  #     MEDIUM = 候选 & **龙头共振** & total ≥ M
  # 共振是小概率事件（候选池内约 8~12%），且 `gate_bonus > 0`（只有入选才兑现）
  # 本身就意味着 `total ≥ 70` —— 所以中信号线切的是"共振板块"那一小撮，
  # 用全候选池的比例去定，必然定偏。
  #
  # 正确做法见 `scripts/calibrate_alert_thresholds.py`（直接按上面两条真实判据
  # 匹配参考轮的**条件占比**）。用重叠区间（20231009~20240227）标定结果：
  #     参考轮政策占比：强 4.91% / 中 6.13%
  #     → 新阈值 强 83（5.08%）/ 中 81（6.34%）；预计告警条数 0.86x
  strong_score: 80.0           # 🔴 强信号：最终评分 ≥ 80（V2.4 重标定）
  strong_min_dims: 2           # 且**至少 2 个维度**超过各自阈值 70%
  strong_dim_ratio: 0.70
  medium_score: 77.0           # 🟡 中信号：最终评分 ≥ 77（V2.4 重标定）
  medium_requires_resonance: true  # 且必须触发龙头共振
  # ---- 🆕 突破触发：越过**它自己**的长期震荡上沿 ----
  #
  # 用户报障"多个板块的告警滞后真值日、基本在顶部才报"。逐日核对后的机制是：
  # **能不能报由绝对阈值 + 加分决定**，而不是由"它是不是刚突破自己的区间"决定。
  # 实测农业种植 885812 在 20260623 六维排名是**全市场第 8**，`total` 62.3
  # 却低于中信号线 → 不报；真正报出来靠的是三天后的门控加分 +15。
  #
  # 绝对阈值全市场统一 → 普涨时真领涨的板块只排 60 分档就被漏掉，
  # 等它"足够极端"时行情已到中后段。所以并行加一条**只看它自己**的触发。
  breakout_enabled: true
  breakout_lookback_days: 60    # 回看约一季。实测 30/60/120/250 合格率几乎相同
                                # （13%/13%/7%/7%）—— 它**不是**卡住的旋钮；
                                # 30 天偏"短期波段"，与"长期震荡上沿"语义不符
  breakout_quantile: 0.90       # 上沿取历史 total 的 90 分位
  breakout_min_score: 50.0      # 全局下限：低于它的"突破"不报（防矮子里拔将军）
  breakout_min_samples: 20      # ⚠️ **这才是覆盖率杠杆**：60→20 让"至少报出过
                                # 一次"的板块从 53% 升到 74%，日均只多 0.4 条。
                                # 它**必须 ≤ lookback**，否则该路径永不触发 ——
                                # 实测 lookback 20/30/40 配 min_samples 60 时命中 0
  breakout_fresh_days: 10       # "刚越过去"：最近 10 天必须都在上沿之下
                                # （否则持续走强的板块天天报，实测占候选池 11~20%）
  weak_extreme_zscore: 3.0     # 🟢 弱信号：单一维度极端异常
  # 「连续 2 个信号周期内触发」作为确认条件（区分试盘与真启动）
  confirm_periods: 2
  cooldown_days: 5             # 同一板块同等级告警冷却（交易日）
  # 各维度"满分基准阈值"：维度分 ≥ ratio × 该值 才算达标
  default_dim_threshold: 60.0
  dim_thresholds:
    trading: 60.0
    prosperity: 60.0
    moneyflow: 65.0
    chips: 55.0
    macro: 55.0
    technical: 60.0
    leverage: 65.0
    northbound: 65.0
    volume_price: 60.0

  # ---- 龙头提名通道（"雪中送炭"）----
  #
  # 为什么需要它：2024-06 医药是最好的反例 —— 医疗服务板块的龙头资金集中度
  # 达到 110%~162%（药明康德逆势吸筹），但它第一层六维分只有 43、排 61/93，
  # **连候选池都没进**，于是第三层根本没被评估，20 分门控加分被直接丢弃。
  # 根因不是门槛高低，而是**评估范围**：第一层六维本质是趋势/状态模型，
  # 在板块刚开始转折时必然给低分（医药当时景气度 18、技术 36）。
  # 而"龙头先动、板块还没动"恰恰是本模块声称要抓的"启动前"场景。
  #
  # 因此给第三层开一条独立提名通道：没进候选池也能进观察/告警，
  # 并标注 promoted=True（未经第二层，分数不与精选板块直接可比）。
  nominate_enabled: true
  nominate_min_concentration: 0.45  # 龙头吸走板块全部资金动作的比例门槛
  nominate_min_score: 35.0           # 第一层分下限（防"抢反弹"噪声）
  nominate_limit: 8                  # 共振通道的单次提名上限（再多就变刷屏）
  # ETF 异动通道的**独立**提名上限。
  #
  # 为什么不与上面共用一个名额池：两条通道回答的是两个不同问题
  # （"资金是否集中在龙头股上" vs "场外资金是否在申购这个板块"），
  # 共用一个池必然互相饿死。实测 2026-07-06：共用 8 个名额时共振那边
  # 当天就有 8 个以上达标，**ETF 通道实际拿到 0 个名额** —— 农业种植
  # 加了 15 分、总分 67.99，却一条告警都没有。
  # 而 `_decide_level` 规定候选池外的板块只能走提名通道，所以名额被占满
  # = 这条通道彻底失效，而"第一层看不到的拐点"正是它存在的唯一理由。
  # 代价：总告警从 31 条增至 34 条（+3），有界。
  nominate_etf_limit: 3

# ================================================================
# 七、回测（Purged Walk-Forward）
# ================================================================
backtest:
  train_days: 120              # 训练集长度
  validate_days: 20            # 验证期长度
  purge_days: 10               # 训练/验证之间的 purge window（防前视）
  holding_days: [5, 10, 20]    # 持有期
  top_n: 10                    # 组合取前 N 名板块等权
  min_boards: 20               # 单期有效板块数下限（不足则该期跳过）
  # 评估目标阈值（报告里标注达标与否，不参与计算）
  targets:
    ic_mean: 0.08
    icir: 1.20
    ic_win_rate: 0.58
    long_short_annual: 0.20
    long_excess: 0.10
    signal_hit_rate: 0.55
    false_positive_rate: 0.30
    avg_max_gain: 0.15
  # 信号兑现/假阳性的判定口径
  hit_threshold: 0.05          # 触发后 20 日涨幅 > 5% 记为兑现
  max_gain_window: 60          # 告警后 N 日内的最大涨幅
  annual_trading_days: 244
  # 回测采样步长（交易日）。默认 1 = 逐日评估。
  # 调大纯粹是"用精度换时间"：一天完整漏斗约 1.2~2 秒（31 个申万行业），
  # 1150 个交易日要 25~40 分钟；step_days=5 把 IC 样本从 1150 降到 230
  # （仍够算 ICIR），耗时降到 1/5。快跑验证时可临时调大。
  step_days: 1
  # 跨层因子相关性上限：超过它就在报告里列为"需正交化/删除"（需求 4.4）
  correlation_limit: 0.70

  # 分场景验证案例（需求 4.5）。全部写在这里，代码不硬编码日期。
  #
  # ⚠️ 关键字必须**同时覆盖申万一级行业名与概念板块名**：
  #    案例原文用的是题材名（CRO / 锂电 / 券商），但若本地只放开了申万一级
  #    行业（`universe.include_concept=false`），板块名会是"医药生物""电力设备"
  #    "非银金融"—— 只写题材名会让四个场景**永远匹配不上**，
  #    而报告里表现为"未触发"，看起来像模型没抓到，实际是关键字没对上。
  scenes:
    - key: cro
      label: CRO（2024.6）
      keyword: [CRO, 医疗服务, 创新药, 医药生物, 生物制品]
      start_date: "20240624"
      check_window: ["20240601", "20240624"]
      min_lead_days: 3
      note: 启动前 6/12-6/20 是否触发
    - key: lithium
      label: 锂电6F（2025.8-9）
      keyword: [锂电, 锂电池, 碳酸锂, 盐湖提锂, 六氟磷酸锂, 能源金属, 电力设备, 有色金属]
      start_date: "20250829"
      check_window: ["20250715", "20250829"]
      min_lead_days: 5
      note: 8/11 天齐锂业净流入 11.89 亿时是否触发
    - key: agriculture
      label: 农业种植（2026.7-8）
      keyword: [农业种植, 种植业, 农林牧渔, 种业, 转基因, 饲料]
      start_date: "20260731"
      check_window: ["20260615", "20260731"]
      min_lead_days: 10
      note: 7/6 农林牧渔净流入 6.83 亿时是否触发
    - key: broker
      label: 券商（2026.Q2）
      keyword: [证券, 券商, 互联金融, 金融科技, 非银金融, 保险]
      start_date: "20260630"
      check_window: ["20260401", "20260630"]
      min_lead_days: 10
      note: 两月横盘末期是否触发

# ================================================================
# 八、期货先行信号
# ================================================================
futures:
  enabled: true
  # 品种 ↔ A 股板块映射表（configs/ 下；每季度用 250 日滚动相关校准强度）
  mapping_file: mainline_futures_mapping.yaml
  # 内盘品种名录发现的交易所
  exchanges: [SHFE, DCE, CZCE, CFFEX, INE, GFEX]
  # 信号一：价格动量
  momentum:
    zscore_window: 60
    zscore_trigger: 1.5
    ret_10d_trigger: 0.05      # 10 日涨幅超过 5%
  # 信号二：期货-板块相关性跃升
  correlation:
    window: 20
    low_threshold: 0.30        # 从 <0.3
    high_threshold: 0.60       # 跃升至 >0.6
    lookback_days: 5           # 在 N 日内发生跃升
  # 信号三：持仓量异动
  open_interest:
    window: 5
    change_trigger: 0.10       # 持仓量 5 日增幅 > 10%
  # 信号四：期限结构（近月-远月价差由贴水转升水）
  term_structure:
    enabled: true
  # 告警规则
  alerts:
    domestic_gain_pct: 0.05    # 内盘品种 5 日涨幅 > 5%
    domestic_oi_change: 0.10   # 且持仓量增幅 > 10%
    foreign_daily_gain: 0.03   # 外盘品种单日涨幅 > 3%
    chain_min_varieties: 3     # N 个以上同产业链品种同时异动 → 产业链级
  # 回测检验项
  backtest:
    min_median_lead_days: 5
    min_median_max_gain: 0.15  # 60 日内最大涨幅中位数 ≥ 15%
    max_gain_window: 60
  # 映射表季度校准（用过去 250 个交易日的滚动相关系数调整强度字段）
  recalibration:
    window_days: 250
    interval_days: 90

# ================================================================
# 九、板块类型差异化参数
# ================================================================
# 农业/题材类止损更严、信号衰减更快；大盘蓝筹可放宽。
board_profiles:
  default:
    decay_days: 20
    label: 通用
  blueprint:                  # 大盘蓝筹（银行/非银/白酒等）
    decay_days: 25
    label: 大盘蓝筹
  theme:                      # 题材/概念类
    decay_days: 10
    label: 题材概念
  agriculture:                # 农业种植类
    decay_days: 10
    label: 农业种植
  board_overrides:            # 按板块名指定类别（包含匹配）
    agriculture: [农林牧渔, 农业种植, 种业, 养殖业, 饲料, 猪肉, 鸡肉, 转基因]
    blueprint: [银行, 证券, 保险, 白酒, 石油石化, 煤炭, 钢铁, 电力]

# ================================================================
# 十、数据源与本地缓存
# ================================================================
data:
  # 主线专属数据仓（**独立于 15 GiB 行情仓**，备份/清理策略完全不同）
  cache_path: data/mainline_cache.db
  # 东方财富免费接口限速：请求间隔 ≥ 1 秒
  eastmoney_min_interval: 1.05
  eastmoney_timeout: 15.0
  # 板块目录刷新间隔（小时）
  catalog_ttl_hours: 24
  # 行情/指标缓存 TTL（秒）
  snapshot_ttl_seconds: 300
  # 历史回看长度（交易日）—— 覆盖 IC 窗口 + 训练集 + purge
  history_days: 400
  # 概念板块的最小/最大成分股数（过滤掉「沪深300样本股」这类宽指数）
  min_members: 5
  max_members: 400
  # 板块名排除关键字：宽基/风格指数不是题材主线。
  # 实测同花顺名录里混着「同花顺A50全成分」「同花顺中证30全成分」这类板块 ——
  # 成分股数合规（min_members 拦不住）、走势与大盘几乎重合，
  # 一旦进榜会长期占据主线头部并把真正的题材挤出去（且"分数很高"不会引起怀疑）。
  exclude_keywords: [全成分, 成份, 成分股, 样本股, 指数成分, 等权, 加权, 标的证券]
  # 每轮打分最多算多少个板块（目录异常时不要让接口挂住）
  max_boards: 320
  # 东财 datacenter 北向持股：免费接口，参数保守
  northbound_page_size: 500
  northbound_min_interval: 0.35

universe:
  # 标的池来源（用户口径 2026-09-20）：
  #   crowding = **复用「板块拥挤度」模块当前配置的板块池**
  #              （sector_crowding_list 里 visible=1，实测 445 个）
  #   catalog  = 自建名录（ths_index 概念 + 申万一级），约 2200 个板块
  #
  # 为什么默认 crowding：拥挤度界面上"哪些板块可见"的勾选**就是研究判断本身**。
  # 主线再自己拉一份 ths_index 只会得到两个慢慢漂移的板块池，而且你在拥挤度里
  # 做的增删在主线上不生效。
  source: crowding
  # 以下三项只在 source=catalog 时生效
  include_sw_l1: false
  include_concept: true
  concept_source: ths

  # 板块黑名单（`configs/` 下的文件名）。
  #
  # 板块池 = `sector_crowding_list` 全部板块 − 黑名单 − 名称规则排除项。
  # 今天 933 − 488 = 445，再排掉 5 个非概念指数 → **440 个入池**。
  #
  # 清单是**冻结**的：只登记 2026-09-20 时点 `visible=0` 的那 488 个。
  # 之后新增的概念板块**不在清单里，会自动入池并同步数据** —— 这是刻意的，
  # 新概念正是要跟踪的对象，不能因为「默认隐藏」就被漏掉。
  #
  # ⚠️ 文件读不到时会**回退**到旧的 `visible = 1` 选池，并在同步 message 里
  #    写明「回退」。回退不会让数量突变（今天两者都是 440），但意味着新板块
  #    会开始被漏掉，所以要把它当成需要处理的告警而不是正常状态。
  blacklist_file: sector_blacklist.yaml

  # 板块名排除正则：不含题材含义的策略 / 风格 / 行业 / 地区指数。
  # ⚠️ 「同花顺」是**数据商前缀而不是题材名** —— 带这个前缀的全是策略/风格/
  #    宽基指数（同花顺A50、A50全收益、金仓30全收益、金仓100、全50、漂移100…），
  #    它们与宽基指数几乎重合，进榜单会长期占据头部并把真正的题材挤出去
  #    （而且"分数很高"，不会引起怀疑）。一条 `^同花顺` 覆盖全部。
  # 其余几条与 sector_crowding/config.yaml 的同名规则保持一致 —— 两个模块对
  # "什么算概念"必须给出同一个答案，否则同一个板块在拥挤度里被排除、
  # 在主线上却进榜，使用者无法判断该信哪个。
  exclude_name_patterns:
    - "^同花顺"
    - "全收益$"
    - "^昨日涨幅"
    - "^昨日跌幅"
    - "^昨日换手"
    - "样本股$"
    - "成份股$"
    - "成分股$"
    - "业指数$"
    - "市指数$"

  # 按**代码前缀**排除：
  #
  # `871` —— GICS 式港股/美股行业分类（商业银行 / 航空航天与国防 /
  #   客运航空公司 / 半导体产品与设备 / 互动媒体与服务 / 居家用品 …共 34 个）。
  #
  # `881` / `884` —— **同花顺行业板块（一级/二级）**。用户 2026-09 口径：
  #   经实测，Ground Truth 的 45 条事件**没有一条只能靠行业板块映射**
  #   （仅行业命中 = 0），概念段（885/886）覆盖全部 45 条。
  #   而行业段内部先自己重复（881 与 884 有 29 对成分股**完全相同**、
  #   507 对近似包含），再与概念段重复（37/45 条事件同时命中两段）。
  #   这类重复在横截面分位里会重复占位、虚高有效样本、吃掉候选池多样性，
  #   故整段移除：**不分析拥挤度、也不做板块成分股过滤**（用户口径）。
  #
  # 用前缀而非逐条列代码：这是一整个体系，将来新增的同体系指数也该一起排除。
  # 与"新增概念自动入池"不冲突 —— 新 A 股概念落在 875/885/886 段。
  exclude_code_prefixes: ["871", "881", "884", "875", "864"]

  # 按**具体代码**排除：地域性概念 + 统计性/风格板块。
  # ⚠️ 名字正则在这里不可用：「智慧城市」含"市"却是真概念，
  #    「上海自贸区」含"上海"确是地域 —— 一条正则必然误伤，所以用冻结清单。
  # ⚠️ 这份清单只影响**分析池**（谁进 ml_board 参与排名与告警），
  #    **不影响拥挤度的数据更新** —— 地域板块在拥挤度界面仍可查看。
  #    要让某个板块彻底停止更新数据，请加进 blacklist_file。
  # 保留未剔除的边界项：国企改革×2 / 上海国企改革 / 央企国企改革 / 创投概念
  #    （政策主题，2023 年真实走出过主升浪）；参股券商 / 参股银行
  #    （形态偏统计，但「参股券商」是券商类事件在池内唯一的映射标的）。
  exclude_codes:
    # ---- 地域性概念（12）----
    # ⚠️ `885939.TI 海峡两岸` **刻意不在清单里**（用户指定保留）：
    #    它是 2025-11 电池产业链行情的映射标的之一，剔除会让该事件失去
    #    一个观测板块。地域性板块里这是唯一被点名保留的。
    - "875039.TI"   # 雄安概念股
    - "875041.TI"   # 一带一路
    - "885494.TI"   # 一带一路
    - "875163.TI"   # 海南板块
    - "885345.TI"   # 新疆振兴
    - "885472.TI"   # 上海自贸区
    - "885591.TI"   # 中韩自贸区
    - "885617.TI"   # 福建自贸区
    - "885744.TI"   # 雄安新区
    - "885764.TI"   # 自由贸易港
    - "885894.TI"   # 海南自贸区
    - "886086.TI"   # 西部大开发
    # ---- 统计性 / 风格板块（7）----
    - "873901.TI"   # 次新股
    - "885598.TI"   # 新股与次新股
    - "885905.TI"   # 注册制次新股
    - "885907.TI"   # 科创次新股
    - "875227.TI"   # 高股息概念
    - "886072.TI"   # 高股息精选
    - "885742.TI"   # 摘帽

    # ---- 第二批：提纯结果暴露出"100% 纳入"的板块 ----
    # 判据：一个板块若**全部成分股都被纳入**，通常说明它不是题材而是
    # **财务/事件属性** —— 因为"是不是 ST""有没有被举牌""业绩预增了没"
    # 对每只成分股都成立，主营相关度判定自然全过。
    # ⚠️ `885699.TI ST板块` **用户指定保留**，故不在此清单 —— 虽然它同样
    #    是"属性而非题材"，但用户口径优先。
    - "885893.TI"   # 国家大基金持股
    - "886110.TI"   # 2026中报预增
    - "885587.TI"   # 举牌
    - "885663.TI"   # 证金持股
    - "885739.TI"   # 股权转让(并购重组)
    # ---- 第二批：地域板块（第一批漏掉）----
    - "885514.TI"   # 京津冀一体化
    - "885487.TI"   # 天津自贸区
    - "885521.TI"   # 粤港澳大湾区
    - "885965.TI"   # 中俄贸易概念
    # ---- 第二批：真概念，但用户指定剔除 ----
    # 这两个**不是**关键词误判：`一体化压铸`（汽车压铸工艺）与
    # `光伏建筑一体化`（BIPV）都是有真实主升浪的题材。我原先按"真概念"
    # 保留，用户 2026-09 明确要求剔除，故列入。
    - "886000.TI"   # 一体化压铸
    - "885920.TI"   # 光伏建筑一体化
    #
    # ⚠️ `885939.TI 海峡两岸` **刻意不在清单里**（用户指定保留）。
    #   `886021/885493/885595/885697 国企改革系列`、`885705 乡村振兴` ——
    #   政策主题（有真实主升浪），不是纯地域或统计属性，暂不剔除。
    #   `885939.TI 海峡两岸` —— 用户明确要求保留。
    #   `886021/885493/885595/885697 国企改革系列`、`885705 乡村振兴` ——
    #     政策主题（有真实主升浪），不是纯地域或统计属性，需人工判断。

  # 申万一级行业固定代码表（sw_daily 的 L1 区间）
  sw_l1_range: ["801010", "801980"]
  # 基准指数（沪深300）
  benchmark: "000300.SH"

notify:
  # 钉钉/飞书机器人 webhook **一律经环境变量注入**，禁止写进本文件
  # MOSS_MAINLINE_DINGTALK_WEBHOOK / MOSS_MAINLINE_FEISHU_WEBHOOK
  enabled: true
  # 只推送到该等级及以上（strong / medium / weak）
  min_level: medium
  timeout: 10.0

disclaimer: >-
  本模块输出为基于公开历史数据的量化统计结果，不构成任何投资建议。
  评分与告警仅反映历史数据中的统计特征，不保证未来收益；期货先行信号
  同样存在传导失效与相关性漂移风险。请结合基本面与自身风险承受能力独立决策。
