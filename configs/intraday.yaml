# ============ 信号推送（实心三角才推送；空心三角仅站内） ============
notify:
  enabled: true
  # 仅推送正式信号（实心三角）与止损警告，避免提示线噪音
  push_solid_only: true
  # 同标的同方向信号的推送冷却（分钟）
  cooldown_minutes: 30
  # 飞书/钉钉/企业微信 群机器人 Webhook（经环境变量注入，禁止硬编码）
