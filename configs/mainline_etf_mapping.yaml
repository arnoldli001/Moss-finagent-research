# 规模与流动性门槛（避免把"迷你 ETF 的单日异动"当成板块信号）
filters:
  # 最近一日成交额下限（**元**）。`ml_etf.amount` 落库时已从
  # Tushare 的「千元」换算成元；500 万元是个保守下限。
  min_amount: 5000000.0
  min_history: 30           # 至少要有多少根日线才参与计算
