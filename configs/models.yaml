# 模型路由配置

# 任务层级 → 主备模型（主模型失败自动降级到fallback）
routing:
  light:              # 数据清洗、格式化等基础任务
    primary: local_light
    fallback: deepseek-flash
  medium:             # 信息层处理（A05去伪/A06提取）：本地模型为主，云端兜底
    primary: local_medium
    fallback: deepseek-flash
  reasoning:          # 宏观/中观/微观/财务风险等核心分析
    primary: deepseek-flash
    fallback: local_medium
  decision:           # 投研建议综合（A17）
    # fallback 必须是**另一个 provider**：原来写的是 deepseek-flash，而
    # deepseek-v4-pro 与 deepseek-flash 同属 provider=deepseek（同一端点、
    # 同一份 key、同一个熔断器），于是 DeepSeek 一熔断主备一起被拒、
    # 整条链必然失败 —— 等于没兜底，而本机 Ollama 明明是好的却没人用。
    # 实测踩过：deepseek 熔断后投研分析直接报
    # 「全部模型调用失败（链: deepseek-v4-pro→deepseek-flash）」。见 docs/LLM_ROUTING.md
    primary: deepseek-v4-pro
    fallback: local_medium

models:
  local_light:
    provider: "ollama"
    model_name: "qwen2.5:1.5b-instruct-q4_K_M"
    base_url: "http://localhost:11434"
    max_tokens: 2048
    temperature: 0.1

  local_medium:
    provider: "ollama"
    model_name: "qwen3:8b-q4_K_M"
    base_url: "http://localhost:11434"
    max_tokens: 4096
    temperature: 0.1

  deepseek-flash:
    provider: "deepseek"
    model_name: "deepseek-flash"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096  # 推理模型思维链+正文：3072推理+1024输出足够，过大会导致延迟与浪费
    temperature: 0.1
    cost:
      input_cache_hit: 0.02  # 元/百万token
      input_cache_miss: 1.0
      output: 4.0

  deepseek-v4-pro:
    provider: "deepseek"
    model_name: "deepseek-v4-pro"
    base_url: "https://api.deepseek.com"
    max_tokens: 4096  # decision层输出更结构化但4096足够（含思维链）
    temperature: 0.1
    cost:
      input_cache_hit: 0.5
      input_cache_miss: 4.5
      output: 13.5
    # 注：providers.py当前仅注册 ollama/deepseek；pro不可用时decision层自动降级flash
