# 派生指标（公式化）—— 「没实现的概念」的**通用构造流水线**的注册表。
#
# 用户口径（2026-09-29 原话）：
# > 「① 银行息差 未实现，这种未能实现的概念，可以先**联网搜索概念的意义及公式**，
# >   根据公式里**设计的数据名称**，再去找**本地数据库和联网数据**，最后**计算**
# >   （编码 agent）」
#
# 这条流水线分四步，**每一步都有单一真值源**：
#
#   ① 概念 → 公式：本文件（`formula` + `sources` 里必须带**出处 URL**，
#      不允许凭记忆写公式 —— 公式写错会产出"看着有据的错误数字"）
#   ② 公式 → 需要的**数据名称**：本文件的 `inputs`（每个符号给**候选名序列**，
#      由具体到近似，**必须写明近似会往哪个方向偏**）
#   ③ 数据名称 → 取数：走既有确定性流水线（`local_catalog_search` → `local_query`
#      → 连接器 → `network_fallback` 联网兜底）；拿不到就是**缺口**，
#      由既有 `gap_queue` 排队补取（**绝不用 0 兜**）
#   ④ 计算：`src/domain/indicators/derive.py` 的**受控求值**（AST 白名单算子，
#      不执行任意代码）—— 编码 agent（A19）负责把"新公式/新输入"落成本文件条目，
#      而不是在运行时执行它生成的代码
#
# ⚠️ 加一条新派生指标时：`sources` 与 `basis` 缺一不可；判据见
#    `tests/unit/test_derived_indicators.py`（含"没有出处就不许加载"）。

derived:
  # ---------------------------------------------------------------- 银行
  - id: "净息差:{code}"
    name: 净息差
    aliases: [净息差, NIM, 银行息差, 净利息收益率, 净息差(NIM)]
    # 出处：全国股转系统《公开转让说明书》披露口径 ——
    # 「（11）净息差（= 利息净收入/生息资产平均余额）」
    formula: "利息净收入 / 生息资产平均余额 * 100"
    unit: "%"
    frequency: quarterly
    sources:
      - "https://www.neeq.com.cn/disclosure/2017/2017-03-23/1490254684_855054.pdf#21#3"
      - "https://www.citicbank.cn/about/investor/financialaffairs/summary/"
    inputs:
      # 候选名**由具体到近似**；命中的那个连同来源/期间一起写进 extra。
      利息净收入:
        - "利息净收入"
        - "利息净收入:同比"   # 只有同比时**不许**当水平值用（见 bias 说明）
      # 生息资产平均余额 = (期初 + 期末) / 2；拿不到就用总资产近似。
      生息资产平均余额:
        - "生息资产平均余额"
        - "生息资产"
        - "总资产"
    bias: >
      **分母退化会让净息差系统性偏低**：生息资产 < 总资产（总资产含固定
      资产、无形资产、递延税资产等非生息部分），用「总资产」代替会让分母偏大
      ⇒ 净息差**偏低**、且**不可与年报口径直接比较**。
      所以 extra 必须写明 `used_inputs`（实际用了哪个候选名）与 `bias`，
      `confidence` 随退化下调 —— 不许把近似值当精确值下发。
    notes: >
      银行专用。非银行主体（生息资产占比很低）算出来没有意义 ——
      调用方需自行判断适用性；本条目不做行业白名单（判断留给分析层，
      而不是在取数层埋一个看不见的拒绝）。
