# 主线挖掘 · 板块成分股池（人工增删）
#
# ================================================================
# 这个文件解决什么问题
# ================================================================
# 概念板块的成分股来自同花顺 ths_member，**一只股票可以属于几十个概念**，
# 其中大量是"蹭概念"的：大市值股因为被主题基金持有而被挂进去，小市值股
# 因为名字沾边被挂进去。实测（2024-06-12）：
#
#     CRO概念   77 只成分股 → 成交额 top30% 贡献了 |净流入| 的 84%
#     医疗服务  56 只成分股 → top30% 贡献 83%
#     农业种植  93 只成分股 → top30% 贡献 69%
#
# 即 70% 的成分股只贡献 16~31% 的资金动作，却把信号稀释掉。
#
# ================================================================
# 自动规则与人工规则的优先级
# ================================================================
#   人工 exclude  >  人工 include  >  人工 keep_all  >  自动规则（成交额 top_pct）
#
# 自动规则一定会有判错的时候（"这个板块到底该看哪几只票"终究是研究判断），
# 因此这里必须有**不改代码就能增删**的入口 —— 下面的 `boards` / `keywords`
# 就是那个入口。默认整个文件是空的（全部走自动规则），需要时再往里加。
#
# ================================================================
# 怎么改
# ================================================================
# 1) 先看系统认为"最相关"的是哪些票：
#      python -m src.mainline.pool --dump 881175
#    （或读 `datastore` 的 `relevance_scores`；面板的股池视图用的同一份数据）
# 2) 把判错的写进 `boards`（按板块代码，最精确）或 `keywords`（按板块名包含匹配）
# 3) `keep_all: true` 表示该板块**完全不过滤**（成分股本身就很纯的板块用）
# 4) 改完不需要重启：规则文件与主配置一样按 mtime 热重载

version: 1
updated_at: "2026-09-20"

# 全局默认（留空则用 configs/mainline.yaml 的 pool 节）
defaults:
  # top_pct: 0.30        # 只保留成交额最高的前 30%
  min_circ_mv: 3.0e9   # 流通市值下限（元）。默认不启用：小市值票常是题材的早期龙头，一刀切会把它筛掉；需要时再开。

# 按**板块代码**精确指定（优先级最高）
boards: {}
  # 881175.TI:                      # 医疗服务
  #   include: [300347, 300759]     # 强制保留（自动规则漏掉的）
  #   exclude: [300015]             # 强制剔除（蹭概念的大市值股）
  # 885927.TI:                      # CRO概念
  #   keep_all: false

# 按**板块名关键字**指定（包含匹配，取最长命中；适合一次覆盖一族板块）
keywords: []
  # - keyword: 医疗服务
  #   exclude: []
  # - keyword: ST
  #   keep_all: false
