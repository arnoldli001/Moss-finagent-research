# 凭据扫描的**允许清单** —— 单一所有者见 `src/core/secret_scan.py`
#
# 用法：当某个**已跟踪**文件里确实必须出现一个"形似凭据"的字符串，且它**不是**
# 真值时，在这里登记一条；判据（`tests/unit/test_no_secrets_in_tracked_tree.py`）
# 会把它从违规里剔除。
#
# 三条硬约束（都由判据机器强制，不靠自觉）：
#   1. 必须写 `why`，且不少于 8 个字 —— 不写理由的豁免等于给文件开天窗；
#   2. 每条必须**真的压住至少一条命中**，压不住就是历史残留，判据报"条目已过期"；
#   3. 空清单是**合法**状态 —— 说明当前没有需要豁免的例外。
#
# 什么时候**不该**用这里：
#   - 值本身是"顺序数字/顺序字母"这类明显编造（`12345678901234`）→ 检测器自带识别；
#   - 目录整体不该出现某类形态（如测试夹具的口令）→ 用 `src/core/secret_scan.py`
#     的 `EXEMPT_PATH_RULES`，那里要求写明"为什么整个目录可以豁免"，且数量会被统计。
#
# 当前为空：2026-10-02 的全树扫描（1478 个已跟踪文件）在清除历史泄漏后
# 已经能做到 0 命中，不需要任何例外。
