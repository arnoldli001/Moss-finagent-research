  # ============ A12 合规规则的比率族（消费者：compliance/logic.py）============
  #
  # 为什么必须登记：这 6 个族被 `src/domain/agents/analysis/compliance/logic.py`
  # 的 4 条比率规则 + 存贷双高**直接消费**（阈值 30/50/80/100 都是百分数口径）。
  # 实测（2026-09-29）在生产者落地前它们**零生产者**，规则永不触发，
  # 而 `compliance_level_calc` 照样给结论 —— 表现为「未见明显合规风险」。
  # 现在 `ComplianceFinConnector` 提供其中 5 族（`关联交易` 见下方说明）。
  #
  # ⚠️ **每族只产窗口内最新一期一个点** —— 规则取"首个命中"，多期会让
  #   「用哪一期」依赖上游排序（与 `fed:policy_range` 同日多值那次事故同类）。
