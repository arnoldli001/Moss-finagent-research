  # ---- 行业侧三族（用户 2026-09-29 追加的②③条需求）----
  #
  # 为什么是 `{行业名}` 而不是 `{板块名}`：`test_contract_consistency.py` 的
  # `_PLACEHOLDER_SAMPLES` 只登记了 6 个占位符（含 `行业名`），用别的新占位符
  # 会让 `test_connector_capabilities_agree_with_supports` 直接红。
  # 板块名与行业名在这三族里本就是同一口径（都来自板块榜单/拥挤度表）。
  - id: "行业拥挤度:{行业名}"
    category: cn_industry
    frequency: daily
    freshness_hours: 26         # 拥挤度表日频
    primary_source: "本地库 moss_finagent.sector_crowding_daily（板块名最长匹配）"
    ttl_days: 365
    notes: >
      行业名 → **最相近的所属概念板块** → 该板块 `water_level`（0~1）。
      匹配档位：exact（归一化相等）→ contains（互为子串，取命中长度最长、
      板块名最短者）；**归一化只做大小写与空白**（`银行(A股)` 与 `银行` 是两个板块，
      不许合并）。候选池 = `sector_crowding_list` ∪ 最近交易日截面，
      与 `概念拥挤度` 的 name join **同源**。
      ★ **用户口径（2026-09-29 已变更）**：原先是「如果找不到就不提示未找到数据」，
      当时落成"规划期不排这个指标"；现行是「**"找不到就不提示"改成
      找不到就去联网搜索找**」⇒ **照排**，本地匹配不上时本连接器不产点，
      由采集链的联网兜底继续找（`supervisor._network_lookup_for_collection`，
      走 `NetworkFallback` 的白名单+预算+冷却熔断）；联网也没有才按缺口如实上报。
      `diagnose()` 的 reason 会写"本地无相近匹配 → 已交联网兜底去找"。
      ⚠️ 边界（诚实登记）：本指标是**平台自定义口径**，外部源没有同名实现
      （实测 `can_fallback("行业拥挤度:X")` = `NO_SOURCE_AVAILABLE`），
      所以联网那一跳对**别的**指标有效（实测 `CPI` 联网取到 128 条），
      对这一族只能"试过并如实拒绝"。
