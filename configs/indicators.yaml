# ============ ★ 已知缺口（诚实登记，不许省略）============
#
# 2026-09-28 第二十五轮实测后**明确不登记**的指标，以及原因。
# 为什么写在这里而不是不写：不写 = 下一个人会以为"没有这一族"，
# 然后把同一个缺口当新问题再查一遍。
#
# ① 「连接器已实现、但登记表不登记」—— **不该登记**（消费者在分析层之外）
#    · index_close:{code} / etf_close:{code}
#      消费者是 `src/intraday`（`sources.py::_daily_indicator()` 拼出
#      `etf_close:{code}`）与 `src/mainline`（`sources.py::index_closes()`）
#      两个**分析层之外**的子系统 —— 它们**不经** `_AGENT_DATA_WHITELIST`。
#      登记进来会被 `tests/unit/test_whitelist_coverage.py::
#      test_every_registered_indicator_is_visible_to_some_agent` 判成
#      **僵尸登记**（"登记了却没有任何 Agent 看得见"）。
#      机器判据见 `tests/unit/test_contract_consistency.py::
#      test_out_of_analysis_layer_prefixes_still_have_consumers`。
#
# ② 「连接器已实现、但登记表不登记」—— **本次未补的真缺口**（同类，待办）
#    下面这些与上面刚补的族**是同一类**（连接器 `supports()` 认、`get_capabilities()`
#    自己声明了、就是登记表没有），只是不在 planner 目录里，所以除了下面这条
#    复核命令之外没有护栏会主动报出来：
#      · ind:sw_first_pb:all          （申万一级 PB 截面）
#      · ind:sw_second_pb:all         （申万二级 PB 截面）
#      · ind:penetration:新能源商用车 / ind:penetration:光伏发电
#      · mkt:turnover:sh / :sz / :cyb / :kcb
#      · mkt:turnover_rate:hist / mkt:north_flow:hist / mkt:margin_net_buy
#    复核方式（现算，不依赖本注释）：把连接器 `get_capabilities()["indicators"]`
#    里**不含占位符**且 `supports()` 为真的条目，与 `indicators.yaml` 的 id 集合求差。
#    ⚠️ 求差时必须**先过滤掉 `supports()` 为假的条目** ——
#       `StarChinextConnector` 声明的是 `turnover:all` / `val:all` 这类**相对键**
#       （不是完整 indicator id，`supports()` 全为 False），
#       把它们算进来会得到一份全是假告警的清单。
#
# ③ 与上面两条**无关**的一个事实更正（曾长期误导过判断）
#    「`quant_daily_basic` 停在 2023-11-10」**是错的**：那是 `data/dev/moss_dev.db`
#    里的化石副本；权威副本在共享行情仓 `data/quant/warehouse.db` 且每日更新。
#    已被本文件「个股/行业估值」段的 `股息率TTM:{code}` 一系 6 条取代。
#
# ============ 配置 schema 校验说明 ============

# 必须包含的字段：id, category, frequency, freshness_hours, primary_source, ttl_days
# frequency 取值白名单：realtime | intraday | daily | weekly | monthly | quarterly | yearly
# freshness_hours 软建议：
#   realtime  < 1
#   intraday  < 4
#   daily     < 26 (含 1 个交易日缓冲)
#   weekly    < 168 (1 周)
#   monthly   < 720 (30 天)
#   quarterly < 2160 (90 天)
#   yearly    < 8760 (365 天)
#
# 修改频率字段时请同时更新 `frequency_to_cron_hours`（src/scheduler/catalog_jobs.py）。