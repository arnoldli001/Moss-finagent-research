  # ★★★ 2026-09-28 第二十三轮：把混合口径拆成三个**独立单值序列**
  #
  # 【为什么必须拆】`fed:policy_range` 同日产 3 条点
  # （DFEDTARU 4.00 / DFEDTARL 3.75 / DFF 3.88），read 侧 `_latest_numeric`
  # 取"最新一条" → 挑中上限或下限之一 → A08 输出
  # 「目标区间 3.75%（FRED 口径）」，**把区间下限当成政策利率**报出去。
  # 数字看着有据，语义是错的 —— 比"缺数据"更危险。
  #
  # 【拆完的读法】方向判断用 `fed:effr`；区间必须
  # `fed:target_lower` + `fed:target_upper` **成对**读。
  - id: fed:target_upper
    category: fed
    frequency: realtime
    freshness_hours: 0.5
    primary_source: "FRED DFEDTARU"
    source_url: "https://fred.stlouisfed.org/series/DFEDTARU"
    ttl_days: 365
    enabled: true
    units: "%"
    notes: "目标区间**上限**（单值序列）；与 fed:target_lower 成对读才是区间"

  - id: fed:target_lower
    category: fed
    frequency: realtime
    freshness_hours: 0.5
    primary_source: "FRED DFEDTARL"
    source_url: "https://fred.stlouisfed.org/series/DFEDTARL"
    ttl_days: 365
    enabled: true
    units: "%"
    notes: "目标区间**下限**（单值序列）；单独用会被误当成利率，必须与 fed:target_upper 成对"

  - id: fed:effr
