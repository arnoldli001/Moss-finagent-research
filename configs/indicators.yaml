  # ============ 平台自有后端数据（消费者：A10 微观 / A11 财务风险 / A20 兜底行业）============
  #
  # 为什么必须登记：这 5 族是**平台自己算出来**的数据（前端看板/主线挖掘/投资日历
  # 早就在用），但采集侧此前**一个连接器都没接** → Agent 侧完全看不到，
  # 用户看到的是"缺数据"（与 `fed:policy_range` 那条报障**同一形状**：
  # 数据在库里，Agent 看不见，且**不报错**）。
  # 生产者：`src/infrastructure/connectors/platform_data_connector.py::PlatformDataConnector`。
  #
  # ★ **id 用模板形态 `X:{code}`，不用裸名字**（与上面 `商誉占净资产比` 那几条不同）：
  #   `catalog/registry.py` 的模板匹配是**按 `:` 分段**的（`_segments()`），
  #   裸名字的 key 是 `(1, ("估值水位",))`，查 `估值水位:600036` 时
  #   两个模板候选键 `(2,("\x00","600036"))` / `(2,("估值水位","\x00"))` **都查不到**
  #   ⇒ 判"未登记" ⇒ SmartFetcher 走 daily/24h 兜底、新鲜度与保留策略全管不到。
  #   ⚠️ 顺带登记一个**已存在的同类缺口**：上面那批裸名字（`商誉占净资产比` /
  #   `资产负债率` / `ROE` …）同样解析不到带代码后缀的查询 —— 属既有问题，
  #   本轮**不动**（不在本次改动范围内），但别照抄那个形状。
  #   ✅ 模板形态同时让 `catalog_jobs.plan_jobs()` 的 `meta.is_template()` 跳过它
  #   —— 裸名字会进批量作业，而作业按裸名取数必然失败（`supports()` 不认裸名）。
  - id: "估值水位:{code}"
    category: individual
    frequency: daily
    freshness_hours: 26         # 底层 PE/PB 序列日频更新（行情仓最新交易日口径）
    primary_source: "平台 intraday 估值链(PE/PB 序列) + 共享行情仓 quant_daily_basic"
    ttl_days: 365
    notes: >
      估值空间分 ∈[-1,1] + 五档结论。**档位/标签/合成分的唯一来源是
      `src/intraday/valuation.py`**（`compute_headroom_score` / `headroom_bucket` /
      `HEADROOM_LABELS` / `ValuationProvider`）—— 本平台前端「估值透支 /
      估值合理偏贵 / 上涨空间充足」就是它给的，**不许有第二份实现**
      （两份的后果是界面与 Agent 同一天给出不同结论）。
      注入采集链时走 `ValuationProvider`（个股分位 + 同业 + 行业中位数，与前端逐字段一致）；
      未注入时退化到行情仓序列，`extra.components_missing` 会明写"未含同业/行业中位数"。
      `extra.sample` / `extra.full_history` 给两个口径的样本区间与样本数
      （**近三年分位 ≠ 全历史分位**）。
