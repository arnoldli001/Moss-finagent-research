  # ★★★ 2026-09-29 第二十五轮：`PMI` / `GDP` 补登记（**生产者到位后才允许登记**）。
  #
  # 【本文件为什么之前没有它们】这两个 id 在系统里有 ≥3 处独立契约当真实指标对待，
  #   却**没有任何连接器实现** —— 那时登记会立刻红在
  #   `test_contract_consistency.py::test_registered_indicators_are_obtainable_or_registered_unobtainable`
  #   （②→①：登记了却取不到）。当时的结论是"真缺口，不许假装修好"。
  #
  # 【现在的实测事实（2026-09-29）】`src/infrastructure/connectors/macro_extra_connector.py`
  #   提供了生产者，`supports()` 全认：
  #     supports('PMI')      -> ['MacroExtraConnector']
  #     supports('GDP')      -> ['MacroExtraConnector']
  #     supports('GDP:同比')  -> ['MacroExtraConnector']
  #   → 缺口已从"没人生产"变成"**没登记**"（与 planner 目录那 6 条同一类），
  #     所以按 `test_contract_consistency.py` 的过期规则**必须补登记、删豁免**。
  #
  # 【族一起登记的理由】`MacroExtraConnector._SPECS` 是一个族：
  #   `PMI` / `PMI:制造业` / `PMI:非制造业` / `GDP` / `GDP:同比`。
  #   只登记 `PMI`/`GDP` 会让下一次报障从"非制造业 PMI 取不到"重新长出来
  #   —— 与 `quant_daily_basic` 列族、渗透率赛道族同一条纪律。
  #
  # 【口径诚实边界（随数据一起下发，别丢）】
  #   · `PMI` 取**制造业**口径（扩散指数，50=荣枯线），不是综合 PMI 产出指数；
  #   · `GDP` 是**累计值**（现价，年内累计，亿元），不是单季值；
  #   · `GDP:同比` 是**累计同比**（不变价，%）—— 金十的 `macro_china_gdp_yearly`
  #     实测是**单季同比**，口径不同，**故意不接为备源**（东财失败即如实报错）。
  - id: PMI
    category: cn_macro
    frequency: monthly
    freshness_hours: 720
    primary_source: "国家统计局 / 中采联（东财口径；备源 NBS-国家统计局，逐值对拍一致）"
    source_url: "https://data.eastmoney.com/cjsj/pmi.html"
    ttl_days: 1825
    units: "指数"
    enabled: true
    notes: "官方**制造业** PMI（扩散指数，50=荣枯线）。⚠️ 不是综合 PMI 产出指数；该口径实测只有 NBS 一个源，要登记请先在 `_SPECS` 加行"

  - id: "PMI:制造业"
    category: cn_macro
    frequency: monthly
    freshness_hours: 720
    primary_source: "国家统计局 / 中采联"
    source_url: "https://data.eastmoney.com/cjsj/pmi.html"
    ttl_days: 1825
    units: "指数"
    enabled: true
    notes: "与 `PMI` **同一序列**的显式口径别名（便于按口径点名）"

  - id: "PMI:非制造业"
    category: cn_macro
    frequency: monthly
    freshness_hours: 720
    primary_source: "国家统计局 / 中采联"
    source_url: "https://data.eastmoney.com/cjsj/pmi.html"
    ttl_days: 1825
    units: "指数"
    enabled: true
    notes: "官方非制造业商务活动指数（扩散指数）"

  - id: GDP
    category: cn_macro
    frequency: quarterly
    freshness_hours: 2160
    primary_source: "国家统计局（东财口径）"
    source_url: "https://data.eastmoney.com/cjsj/gdp.html"
    ttl_days: 3650
    units: "亿元"
    enabled: true
    notes: "国内生产总值**累计值**（现价，年内累计）。⚠️ 不是单季值；季节性与节奏判断请配 `GDP:同比`"

  - id: "GDP:同比"
    category: cn_macro
    frequency: quarterly
    freshness_hours: 2160
    primary_source: "国家统计局（东财口径）"
    source_url: "https://data.eastmoney.com/cjsj/gdp.html"
