# 数据指标索引清单（Indicator Catalog）
#
# 设计目标：
#  1. 给所有投研/中观/量化指标一份"权威元数据"——含数据源、更新频率、新鲜度阈值、来源 URL 模板。
#  2. SmartFetcher 据此决定"哪些走 DB、哪些走网络、按周期表判断 fresh/stale"。
#  3. Scheduler 据 `update_frequency` 自动生成 cron 作业（无需手写 yaml/job）。
#  4. 缺数据的指标在 `_HEAL_BLACKLIST` 之外的，自动触发连接器自修复（沿用现有 A19）。
#
# 字段语义：
#   id            : 唯一 ID（与 supervisor plan_run / LLM planner INDICATOR_CATALOG 对齐）
#   category      : cn_macro / us_macro / mkt_liquidity / cn_industry / individual / fed / ...
#   frequency     : realtime | intraday | daily | weekly | monthly | quarterly | yearly
#   freshness_hours: 在 DB 内未超过此值视为"新鲜"，不再联网；超出即视为 stale 触发 fetch
#                    realtime=0.5, intraday=4, daily=26, weekly=168, monthly=720, quarterly=2160
#   primary_source: 主数据源（显示名，与 Connector.source_name 对齐；运行时不强校验）
#   source_url    : 数据源参考 URL（写审计用）
#   enabled       : 是否启用（False 时 SmartFetcher 不联网、不报错但也不返回数据）
#   ttl_days      : 保留天数（数据库保留策略，prune_before 用）
#   units         : 数值单位（% / 亿元 / 元/吨 ...）
#
# ★ 存储位置（2026-09-28 新增，回答"记录每个数据所在库表"）：
#   storage_backend : 后端类型 + 标识，格式 "<kind>:<name>"
#                     · sqlite:fact_data_points   —— 主事实表（默认，MacroRepository）
#                     · sqlite:<table>            —— 同一 SQLite 文件的其它表
#                     · file:<相对路径>            —— 落盘文件（parquet/csv）
#                     · mysql:<db>.<table>        —— 量化数仓（scripts/quant_warehouse.py）
#                     · postgres:<db>.<table>     —— 可选 PG 后端
#   storage_location: 具体位置（表名 / 文件 glob）。
#                     省略时默认 `fact_data_points`（sqlite 后端）。
#   storage_note    : 人话说明（"这个数据到底在哪"）—— 给运维排查用。
#
#   为什么需要它：投研数据散落在**三种物理位置**（SQLite 事实表 / quant parquet /
#   量化数仓），运维问"这个指标的数据在哪"时，旧版只能靠 grep 代码。
#   索引表把"指标 → 物理位置"变成一次 SELECT。
#
#   未声明 storage_backend 的指标 → 默认 `sqlite:fact_data_points`。
#
# ★ 修改本文件后**必须**:
#   1) 重启后端或跑 `python scripts/rebuild_indicator_catalog.py` 让 DB 索引表同步
#   2) 让 Scheduler 重新生成作业：见 `src/scheduler/catalog_jobs.py`
#   3) 加新指标时同时在 `supervisor.py:INDICATOR_CATALOG`(planner 系统提示) 同步

