  #       trade_date = 20060104 .. 20260928      ← 最新就是当天，**不是僵尸表**
  #       600036 最新一条：dv_ttm=4.9606  total_mv=1024934525184  turnover_rate=0.2637
  #   ⚠️ 行数与最新日期**一律现算**，不许当常量抄进代码/注释 ——
  #      `akshare_connector._QUANT_COLUMN_INDICATORS` 上方那段写过代价：
  #      写死的行数曾被抄到 6 处，其中一处据此决定"不走本地、改走网络自算股息率"，
