# 概念板块的**池级剔除**批次台账（唯一事实来源）
#
# ## 这里是什么
#
# 用户每给一批「这些概念不要了」，就在这里追加一个批次。`scripts/prune_concepts.py`
# 读本文件、解析清单、核对真名，然后一次改三处 —— 因为用户的三句话
# （不计入主线挖掘监控 / 不计入板块拥挤度检测 / 不展示在前端）**共用一个开关**：
#
#   `configs/sector_blacklist.yaml`（由本文件生成它的追加段）
#     ├─ `import_crowding_pool()` → 板块不进 `ml_board`（主线打分池）
#     ├─ `refresh._drop_blacklisted()` → 板块停止拥挤度**日更**
#     ├─ `metrics._sector_blacklist()` → 板块不算拥挤度**指标**
#     └─ 不在池内 ⇒ 不产生任何主线告警
#   `sector_crowding_list.visible = 0` → 前端看板不再展示
#
# ⚠️ **为什么不写进 `mainline_alert_exclusions.yaml`**：那是**告警级**开关
# （板块照常打分、只是不发告警）。本文件是**池级**，比它强一档。
# 同一件事写两处迟早漂移，而漂移方向恰好是"以为关了其实没关"。
#
# ## 为什么要有这个文件（而不是写在脚本里）
#
# 用户已连发 5 批，脚本里内嵌常量每批都要改代码。挪到这里之后：
# 追加一个批次 = 追加一段 YAML，`--list` 能看历史，`--batch N` 能重放，
# 也留下了「谁在什么时候以什么理由剔了什么」的审计线。
#
# ## 怎么用
#
#     python scripts/prune_concepts.py --list              # 看所有批次
#     python scripts/prune_concepts.py --batch 5           # 干跑第 5 批
#     python scripts/prune_concepts.py --batch 5 --apply   # 落库
#     python scripts/prune_concepts.py --all --apply       # 把所有未落库的批次补齐
#
# ⚠️ **池子一动，截面百分位就全变** —— 所有板块的所有历史分数都要重算
# （`rescore_mainline.py --force`，约 80 分钟）。所以尽量**攒够一批再动**。
