# ==================================================================
# 主线挖掘 · 期货品种 ↔ A 股板块 传导映射表
# ------------------------------------------------------------------
# 消费者：src/mainline/futures_mapping.py（结构契约 src.mainline.models.FutureMapping）
# 表规模：93 行 / 89 个品种 = 内盘 55（50 商品 + 5 中金所金融期货）+ 外盘 25 + 非期货 9
#         （4 行是一品种对两板块：SC 原油→航空反向、LC 碳酸锂→能源金属、M 豆粕→养殖反向、
#           LH 生猪→屠宰反向，所以行数 93 大于品种数 89）
#
# 【代码口径 —— 三种约定混在同一列，靠 kind 区分取数路径】
#   kind: domestic     Tushare fut_daily 主力连续，形如 `品种代码.交易所后缀`
#   kind: foreign      AKShare/新浪外盘字母代码（商品）或 Tushare index_global 代码（海外指数）
#   kind: non_futures  汇率 fx_daily(FXCM) / 场内基金 / 国际通行的非 Tushare 代码
#
# 【交易所后缀：实测口径，与交易所英文名不同】
#   fut_basic(fut_type=2) 与 fut_daily 实际返回的后缀是
#     SHF(上期所) / DCE(大商所) / ZCE(郑商所) / CFX(中金所) / INE(能源中心) / GFE(广期所)
#   不是 SHFE / CZCE / GFEX。2026-09-01~09-17 区间实测：
#     fut_daily(ts_code="RB.SHF") → 13 行；"RB.SHFE" → 0 行
#     fut_daily(ts_code="TA.ZCE") → 13 行；"TA.CZCE" → 0 行
#     fut_daily(ts_code="SI.GFE") → 13 行；"SI.GFEX" → 0 行
#   表内 55 个内盘代码已逐个用 fut_daily 验证区间行数 > 0。
#
# 【board_code 命名空间】字段是**信息性**的，匹配仍以 board_name 为准（见 FutureMapping：
#   board_code 允许为空、按名字匹配）。两种命名空间并存，前缀即来源：
#     `883xxx.TI` / `86xxxx.TI` / `88xxxx.TI` = 同花顺指数（ths_index）
#     `80xxxx.SI` / `85xxxx.SI`                 = 申万行业指数（sw_daily）
#   同花顺概念优先（板块名即选股口径），同花顺没有合适的才回落申万一级/二级。
#   全部 54 个 board_name 已逐个校对：在 ths_index(2517 条) 或 sw_daily(439 条) 中真实存在。
#
# 【已知取数风险（不影响本表作为映射字典使用）】
#   1. `USDX.FXCM` 是 Spec 指定的美元指数代码，但 Tushare fx_daily 对该代码返回 0 行；
#      fx_obasic 里 美元指数 的真实代码是 `USDOLLAR.FXCM`，其 fx_daily 行情止于 2023-06。
#      即 Tushare 侧目前**没有**可用的美元指数日线，美元指数需另接 AKShare/新浪外盘。
#   2. `ZN.CBOT` 是十年美债主连（国际通行代码 ZN 属 CBOT），Tushare 无此合约；后缀写
#      CBOT 而不是 CFX，是因为 CFX 实测就是中金所，写成 ZN.CFX 会与上期所沪锌 ZN 混淆。
#   3. 外盘商品字母代码在不同数据源间存在别名（如 布伦特原油 `OIL`），已在各行 logic 内写明
#      交易所与品种全称，换源时以 logic 描述为准而不是以字母为准。
#   4. `IXIC/SPX/DJI/HSI/N225/GDAXI` 走 Tushare index_global（已实测 2026-09 有行情），
#      不走新浪外盘期货接口。
#
# 【direction 语义】positive=期货涨→板块利好；negative=期货涨→板块利空（成本端）；
#   auxiliary=只作宏观流动性/情绪背景，不参与板块评分（非期货 9 行全部是 auxiliary）。
# 【strength】人工设定的传导强度 ★1-5；季度滚动相关学校准值写 calibrated_strength，
#   **不覆盖**本列（口径见 futures_mapping.py 模块 docstring）。
# ==================================================================

# ------------------------------------------------------------------
# 产业链分组：chain 字段的取值域，用于"产业链级异动"判定
#（同一 chain 下 N 个品种同时异动 → 判为链条级异动，而不是单品种噪音）
# ------------------------------------------------------------------
chains:
  - key: precious_metals
    label: 贵金属
    note: 金/银/铂同受实际利率与避险驱动，金银比是同链内部的结构读数
  - key: base_metals
    label: 基本金属
    note: 铜铝锌镍锡 + 氧化铝，同受美元、全球制造业 PMI 与中国地产竣工端驱动
  - key: coal_steel
    label: 煤焦钢矿
    note: 焦煤→焦炭→铁矿石→螺纹/热卷成本与需求同源，双焦同涨即链条级异动
  - key: energy
    label: 能源油气
    note: 原油为定价锚，燃料油/沥青/液化气是其裂解下游；LOF 是场内映射工具
  - key: new_energy
    label: 新能源材料
    note: 工业硅→多晶硅→光伏，锂盐→正极→电池，两条链共同受终端装机与排产驱动
  - key: building_materials
    label: 建材
    note: 纯碱是玻璃第一大原料（成本端），两者同涨要区分是需求共振还是成本推动
  - key: chemicals
    label: 化工
    note: 芳烃链(PX→PTA)、聚酯链、煤化工(甲醇/尿素)、氯碱链，加工费比绝对价格更重要
  - key: rubber
    label: 橡胶轮胎
    note: 天胶/合成胶是轮胎主要成本项，胶价涨对轮胎股是利润压制被需求对冲
  - key: agri
    label: 农产品
    note: 大豆/玉米定种植与压榨利润，粕类定饲料成本，油脂定粮油加工利润
  - key: soft_commodity
    label: 软商品
    note: 白糖/棉花/咖啡，供给受天气与产区政策主导，波动大但传导链短
  - key: breeding
    label: 养殖
    note: 猪价是养殖利润本身、同时是屠宰与肉制品的成本，同一品种上下游反向
  - key: pulp_paper
    label: 浆纸
    note: 浆价占纸企成本六成以上，纸价-浆价价差才是纸企利润
  - key: shipping
    label: 航运
    note: 运价即集运公司收入，绕行/地缘事件是弹性放大器
  - key: financial
    label: 金融期货
    note: 股指期货基差与持仓是机构对冲与风险偏好的读数；国债期货对应无风险利率
  - key: global_equity
    label: 全球股指
    note: 隔夜外盘定 A 股开盘情绪，只作背景不参与板块评分
  - key: macro_fx
    label: 宏观汇率流动性
    note: 美元/人民币/美债是外资流向与国内货币政策空间的先行变量，纯背景项

