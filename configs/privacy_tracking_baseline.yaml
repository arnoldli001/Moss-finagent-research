# 「已跟踪 但 按 .gitignore 本应私有」的**冻结基线**（2026-10-02 实测）
#
# 为什么有这份文件：`.gitignore` **不会** untrack 已经跟踪的文件。
# 实测：343 个文件的路径已经命中'私有'规则，却仍然在公开仓库里
# （面试复盘、主线策略文档、非白名单脚本、私有 skill 副本……）。
# 这些是历史债；本基线把它们**冻结**下来，于是'又漏了一个'会当场变红。
#
# 用法：`tests/unit/test_privacy_tracking_policy.py` 断言'当前集合 ⊆ 基线'。
# 想放宽？只能删条目（撤下文件），不能加条目 —— 加条目要在 code review 里
# 被看见。重新生成：`uv run python scripts/_gen_privacy_baseline.py --write`
# （生成脚本会连同**归因规则**一起写下来，便于按规则成批处理）。
frozen_count: 343

# ── 归因：每个数量对应哪一条 .gitignore 规则 ──
